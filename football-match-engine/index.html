      this._log(`🚩 오프사이드 반칙! ${offender.name} — 수비팀 볼 소유`);
      const defendTeam = offender.team === this.homeTeam ? this.awayTeam : this.homeTeam;
      const nearest = defendTeam.players
        .filter(p => p.role !== 'GK')
        .reduce((best, p) => {
          const d = p.position.sub(this.ball.position).length();
          return (!best || d < best.d) ? { p, d } : best;
        }, null);
      this.ball.offsideLineX   = null;
      this.ball.offsidePlayers = [];
      this.ball.passTeam       = null;
      if (nearest) this._giveOwnership(nearest.p);
    };

    // 1명이면 경합 없이 즉시 소유 (오프사이드 체크 포함)
    if (candidates.length === 1) {
      const sole = candidates[0].player;
      if (isOffside(sole)) { declareOffside(sole); return; }
      this._giveOwnership(sole);
      return;
    }

    // 2명 이상 — 팀 분포 확인
    const teams = new Set(candidates.map(c => c.player.team));
    if (teams.size === 1) {
      // 같은 팀끼리만: 가장 가까운 선수 소유 (오프사이드 체크 포함)
      candidates.sort((a, b) => a.dist - b.dist);
      const closest = candidates[0].player;
      if (isOffside(closest)) { declareOffside(closest); return; }
      this._giveOwnership(closest);
      return;
    }

    // ── 루즈볼 경합 (Loose Ball Duel) ──
    // 각 후보에 대해 strength + control + 주사위(0~50) 로 경합 점수 산출
    let winner = null, topScore = -Infinity;
    for (const { player } of candidates) {
      const score = this._calculateDuelScore(player);
      if (score > topScore) { topScore = score; winner = player; }
    }

    // 경합 로그: 복수의 선수가 경합했을 때만 기록
    const rivalTeamInvolved = candidates.some(c => c.player.team !== winner.team);
    if (rivalTeamInvolved) {
      this._log(`치열한 볼 경합! ${winner.name}이(가) 소유권을 따냅니다.`);
    }

    // ── 오프사이드 판정 ────────────────────────────────────────────────────
    // 패스 수신자가 패스 순간 오프사이드 위치에 있었으면 반칙 선언
    if (
      this.ball.offsideLineX !== null &&
      this.ball.passTeam !== null &&
      winner.team === this.ball.passTeam &&
      this.ball.offsidePlayers.includes(winner.id)
    ) {
      this._log(`🚩 오프사이드 반칙! ${winner.name} — 수비팀 볼 소유`);
      // 수비팀 최근접 아웃필드 선수에게 볼 지급
      const defendTeam = winner.team === this.homeTeam ? this.awayTeam : this.homeTeam;
      const nearest = defendTeam.players
        .filter(p => p.role !== 'GK')
        .reduce((best, p) => {
          const d = p.position.sub(this.ball.position).length();
          return (!best || d < best.d) ? { p, d } : best;
        }, null);
      // 스냅샷 초기화 후 소유권 이전
      this.ball.offsideLineX   = null;
      this.ball.offsidePlayers = [];
      this.ball.passTeam       = null;
      if (nearest) this._giveOwnership(nearest.p);
      return;
    }

    // 오프사이드 아님 — 정상 소유권 이전 후 스냅샷 초기화
    this.ball.offsideLineX   = null;
    this.ball.offsidePlayers = [];
    this.ball.passTeam       = null;
    this._giveOwnership(winner);
  }

  /**
   * 경합(Duel) 점수 산출.
   * strength(몸싸움) + control(볼 제어/민첩성) + 무작위 주사위(0~50)
   * @param {Player} player
   * @returns {number}
   */
  _calculateDuelScore(player) {
    return player.attrs.strength + player.attrs.control + Math.random() * 50;
  }

  /**
   * GK 선방 판정 (슈팅 전용, 능력치 기반).
   * gkPower = (control + positioning) / 2
   * speedPenalty: 볼 속도 8m/s 초과분에 비례
   * 결과: catch(완전 선방) / deflect(편향) / miss(실패)
   */
  _attemptSave(gk) {
    const speed        = this.ball.velocity.length();
    const speedPenalty = Math.max(0, (speed - 8) * 1.5);
    const gkPower      = (gk.attrs.control + gk.attrs.positioning) / 2;
    const roll         = Math.random() * 100;

    const catchThresh   = Math.max(5,  gkPower * 0.55 - speedPenalty);
    const deflectThresh = Math.max(10, gkPower * 0.80 - speedPenalty);

    if (roll < catchThresh) {
      this._giveOwnership(gk);
      gk.kickTimer = 0;
      this._log(`🧤 ${gk.name} 완전 선방! 공을 잡습니다.`);
    } else if (roll < deflectThresh) {
      const deflectAngle = Math.random() * Math.PI * 2;
      this.ball.velocity = Vector2D.fromAngle(deflectAngle).scale(speed * 0.5);
      this.ball.isShot   = false;
      this._log(`🧤 ${gk.name} 선방! 볼을 걷어냈습니다.`);
    }
    // else: miss — 볼 계속 진행
  }

  _giveOwnership(player) {
    const prev     = this.ball.owner;
    const prevTeam = prev?.team ?? null;
    if (prev) { prev.hasBall = false; }
    this.ball.owner       = player;
    player.hasBall        = true;
    player.kickTimer      = 0;
    this.ball.lastTouched = player;
    this.ball.lastTeam    = player.team;
    this.ball.velocity    = Vector2D.zero();
    this.ball.isShot      = false;

    // ── 턴오버(Turnover) 감지 ─────────────────────────────────────────────
    // 이전 소유 팀이 있고 새 소유자가 다른 팀이면 공수 전환 발생
    if (prevTeam && prevTeam !== player.team) {
      const newTeam = player.team;
      const lostTeam = prevTeam;
      const turnoverPos = this.ball.position.clone();

      // 양 팀 모두 transitionTimer 갱신
      for (const team of [this.homeTeam, this.awayTeam]) {
        const isNewOwner = team === newTeam;
        team.tactics.prevWeHaveBall = !isNewOwner; // 전환 직전 상태
        team.tactics.transitionTimer = TR_DURATION;
        team.tactics.transitionT     = 0.0;        // LERP 시작
      }

      // 공격 전환팀(역습): 공격수·윙어는 COUNTER, 나머지는 일반 반응
      const counterRoles = ['ST', 'LM', 'RM'];
      // 수비 전환팀(방금 빼앗긴 팀): 볼 가까운 2명은 GEGENPRESS, 나머지는 RECOVER
      const lostPlayers  = [...lostTeam.players].filter(p => p.role !== 'GK');
      lostPlayers.sort((a, b) =>
        a.position.sub(turnoverPos).length() - b.position.sub(turnoverPos).length()
      );
      const gegenSet = new Set(lostPlayers.slice(0, TR_GEGENPRESS_N).map(p => p.id));

      for (const team of [this.homeTeam, this.awayTeam]) {
        for (const p of team.players) {
          if (p.role === 'GK') { p.reactionDelay = 0; p.transitionRole = null; continue; }

          // 능력치(vision + positioning 평균)가 높을수록 빠른 반응
          const awareness = (p.attrs.vision + p.attrs.positioning) / 200; // 0~1
          p.reactionDelay = TR_REACT_MIN + (1 - awareness) * (TR_REACT_MAX - TR_REACT_MIN);

          if (team === newTeam) {
            p.transitionRole = counterRoles.includes(p.role) ? 'COUNTER' : null;
          } else {
            p.transitionRole = gegenSet.has(p.id) ? 'GEGENPRESS' : 'RECOVER';
          }
        }
      }

      const typeName = newTeam === this.homeTeam ? this.homeTeam.name : this.awayTeam.name;
      this._log(`⚡ 공수 전환! ${typeName} 볼 탈취 — 역습 전개`);
    }
  }

  // ── 충돌 해소 ───────────────────────────────────────────────

  /**
   * 선수 간 원형 충돌 감지 및 해소 (모든 쌍 O(n²), n=22).
   *
   * 처리 단계:
   *   ① 두 선수 중심 간 거리 계산
   *   ② 거리 < PLAYER_RADIUS * 2 이면 충돌
   *   ③ 위치 보정: 겹친 깊이의 절반씩 서로 반대 방향으로 밀어낸다
   *   ④ 속도 교환: 법선 방향 상대속도의 일부를 교환해 몸싸움 효과를 낸다
   *      (PLAYER_COL_RESTITUTION = 0 → 위치 보정만, 1 → 완전 탄성)
   */
  _resolvePlayerCollisions() {
    const players = this._allPlayers();
    const diameter = PLAYER_RADIUS * 2; // 충돌 최소 거리

    for (let i = 0; i < players.length - 1; i++) {
      for (let j = i + 1; j < players.length; j++) {
        const a = players[i];
        const b = players[j];

        const dx   = b.position.x - a.position.x;
        const dy   = b.position.y - a.position.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist >= diameter || dist < 0.001) continue; // 충돌 없음 또는 완전 겹침

        // ① 법선 방향 단위 벡터 (a → b)
        const nx = dx / dist;
        const ny = dy / dist;

        // ② 위치 보정: strength 비율에 따라 약한 선수 쪽이 더 많이 밀린다
        const sa   = a.attrs?.strength ?? 50;
        const sb   = b.attrs?.strength ?? 50;
        const sSum = sa + sb;
        const totalOverlap = diameter - dist;
        a.position.x -= nx * totalOverlap * (sb / sSum);
        a.position.y -= ny * totalOverlap * (sb / sSum);
        b.position.x += nx * totalOverlap * (sa / sSum);
        b.position.y += ny * totalOverlap * (sa / sSum);

        // ③ 속도 교환: 법선 방향 상대속도 성분을 strength 비율로 교환
        const dVx = a.velocity.x - b.velocity.x;
        const dVy = a.velocity.y - b.velocity.y;
        const dVn = dVx * nx + dVy * ny; // 양수이면 서로 가까워지는 중

        if (dVn > 0) {
          // 강한 선수가 약한 선수를 더 많이 밀어낸다
          const impulseA = dVn * PLAYER_COL_RESTITUTION * (sb / sSum) * 2;
          const impulseB = dVn * PLAYER_COL_RESTITUTION * (sa / sSum) * 2;
          a.velocity.x -= impulseA * nx;
          a.velocity.y -= impulseA * ny;
          b.velocity.x += impulseB * nx;
          b.velocity.y += impulseB * ny;
        }
      }
    }
  }

  /**
   * 공과 선수 몸통 간 충돌 해소.
   * 소유자 없는 공이 선수 몸통(PLAYER_RADIUS + BALL_RADIUS) 이내로 들어오면
   * 탄성 반사하며, 선수의 속도 벡터도 일부 공에 전달된다.
   *
   * ※ _updateOwnership 과의 관계:
   *   - 본 메서드는 물리적 충돌만 처리 (공을 튕겨냄)
   *   - 소유권 획득은 이후 _updateOwnership 에서 별도 판정
   *   - 즉, 공이 너무 빠르면 튕겨나가고, 느리면 잡을 수 있음 (자연스러운 트래핑)
   */
  _resolveBallPlayerCollisions() {
    const ball = this.ball;
    if (ball.owner) return;
    // 공이 선수 키보다 높이 떠 있으면 몸통 충돌 없음
    if (ball.height >= PLAYER_HEIGHT) return;

    const minDist = PLAYER_RADIUS + BALL_RADIUS;

    for (const player of this._allPlayers()) {
      // kickLockTimer 중인 kicker: 공과 물리 충돌도 잠시 비활성화
      if (ball.kickLockTimer > 0 && player === ball.kicker) continue;

      const dx   = ball.position.x - player.position.x;
      const dy   = ball.position.y - player.position.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist >= minDist || dist < 0.001) continue;

      // ① 법선 단위 벡터 (선수 → 공)
      const nx = dx / dist;
      const ny = dy / dist;

      // ② 위치 보정: 겹친 만큼 공을 밀어낸다 (선수 위치는 고정)
      const overlap = minDist - dist;
      ball.position.x += nx * overlap;
      ball.position.y += ny * overlap;

      // ③ 상대속도 법선 성분 계산
      //    공의 속도 - 선수의 속도 → 선수 기준 상대속도
      const relVx = ball.velocity.x - player.velocity.x;
      const relVy = ball.velocity.y - player.velocity.y;
      const relVn = relVx * nx + relVy * ny; // 법선 방향 상대속도

      // 공이 이미 선수에서 멀어지는 방향이면 충격량 적용 불필요
      if (relVn >= 0) continue;

      // ④ 반사 충격량: 상대속도 법선 성분을 역전시키고 에너지 감쇠 적용
      //    impulse = -(1 + e) * relVn  (e = BALL_BODY_RESTITUTION)
      const impulse = -(1 + BALL_BODY_RESTITUTION) * relVn;
      ball.velocity.x += impulse * nx;
      ball.velocity.y += impulse * ny;

      // ⑤ 선수 속도 전달: 달려오는 선수에게 맞으면 공이 더 강하게 튕김
      //    선수의 현재 속도 벡터 중 법선 방향 성분을 BALL_BODY_DRAG 비율로 더한다
      const pVn = player.velocity.x * nx + player.velocity.y * ny;
      ball.velocity.x += pVn * nx * BALL_BODY_DRAG;
      ball.velocity.y += pVn * ny * BALL_BODY_DRAG;

      // 최고 속도 클램핑
      const spd = ball.speed();
      if (spd > BALL_MAX_SPEED) {
        ball.velocity = ball.velocity.normalize().scale(BALL_MAX_SPEED);
      }
    }
  }

  // ── 경계 처리 ────────────────────────────────────────────────

  /**
   * 경기장 경계 반사 + 골포스트 충돌.
   *
   * TODO: 세트피스 구현 시 아래 분기를 교체한다:
   *   X 경계 → isGoal() ? _handleGoal() : _handleGoalLineOut() (코너킥/골킥)
   *   Y 경계 → _handleThrowIn()
   */
  _checkBoundaries() {
    const ball = this.ball;
    const { x, y } = ball.position;

    if (x <= 0 || x >= PITCH_LEN) {
      if (this._isGoal(x, y)) {
        this._handleGoal(x);
        return;
      }
      // 골라인 반사 (세트피스 미구현)
      ball.position.x  = Math.max(0.2, Math.min(PITCH_LEN - 0.2, x));
      ball.velocity.x *= -BALL_BOUNCE;
      ball.velocity.y *=  BALL_BOUNCE;
    }

    if (y < 0 || y > PITCH_WID) {
      // 터치라인 반사 (스로인 미구현)
      ball.position.y  = Math.max(0.2, Math.min(PITCH_WID - 0.2, y));
      ball.velocity.y *= -BALL_BOUNCE;
      ball.velocity.x *=  BALL_BOUNCE;
    }

    // 골포스트 충돌 (경계 처리 후에 수행해 골 판정과 분리)
    this._checkGoalPostCollisions();
  }

  /**
   * 공과 4개 골포스트(기둥) 간의 원형 충돌 탄성 반사.
   *
   * 골포스트 좌표 (각 골대의 상단/하단 기둥):
   *   왼쪽 골대: x=0,          y = CY ± GOAL_W/2
   *   오른쪽 골대: x=PITCH_LEN, y = CY ± GOAL_W/2
   *
   * 공이 포스트 반경(BALL_RADIUS) 이내로 들어오면 포스트에서 멀어지는 방향으로 반사한다.
   * 반사 강도: BALL_BOUNCE (수평 경계 반사와 동일한 에너지 보존율 사용).
   */
  _checkGoalPostCollisions() {
    const ball = this.ball;
    if (ball.height >= PLAYER_HEIGHT) return; // 공중볼은 포스트와 충돌하지 않음

    const halfGoal = GOAL_W / 2;
    // 4개 포스트 좌표 목록
    const posts = [
      { x: 0,         y: CY - halfGoal }, // 왼쪽 상단 포스트
      { x: 0,         y: CY + halfGoal }, // 왼쪽 하단 포스트
      { x: PITCH_LEN, y: CY - halfGoal }, // 오른쪽 상단 포스트
      { x: PITCH_LEN, y: CY + halfGoal }, // 오른쪽 하단 포스트
    ];

    const minDist = BALL_RADIUS + 0.06; // 포스트 반경(약 6cm)을 더해 충돌 범위 설정

    for (const post of posts) {
      const dx   = ball.position.x - post.x;
      const dy   = ball.position.y - post.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < minDist && dist > 0) {
        // 포스트 → 공 방향의 단위 법선 벡터
        const nx = dx / dist;
        const ny = dy / dist;

        // 위치 보정: 겹친 만큼 밀어낸다
        const overlap = minDist - dist;
        ball.position.x += nx * overlap;
        ball.position.y += ny * overlap;

        // 속도 반사: 법선 방향 성분만 반전, 에너지 감쇠 적용
        //   v_reflected = v - 2 * (v · n) * n  (탄성 반사 공식)
        const vDotN = ball.velocity.x * nx + ball.velocity.y * ny;
        ball.velocity.x = (ball.velocity.x - 2 * vDotN * nx) * BALL_BOUNCE;
        ball.velocity.y = (ball.velocity.y - 2 * vDotN * ny) * BALL_BOUNCE;
      }
    }
  }

  // ── 골 처리 ─────────────────────────────────────────────────

  _isGoal(x, y) {
    const [topY, botY] = this._goalYRange();
    return (x <= 0 || x >= PITCH_LEN) && y >= topY && y <= botY;
  }

  _handleGoal(x) {
    const leftTeam  = this.homeTeam.attackingDir === 1 ? this.homeTeam : this.awayTeam;
    const rightTeam = this.homeTeam.attackingDir === 1 ? this.awayTeam : this.homeTeam;
    // 왼쪽 골라인(x≤0) → 오른쪽 공격팀(=rightTeam 아님, leftTeam이 왼쪽 공격한 경우)
    const scoringTeam = x <= 0 ? rightTeam : leftTeam;

    scoringTeam.score++;
    this.ball.reset();
    this.ball.owner = null;
    for (const p of this._allPlayers()) p.hasBall = false;

    const h = this.homeTeam.score, a = this.awayTeam.score;
    this._log(`⚽ 골! ${scoringTeam.name} 득점! (${h} : ${a})`);
    this._updateScoreboard();

    // 실점 팀이 킥오프
    this._pendingKickoffTeam = scoringTeam === this.homeTeam ? this.awayTeam : this.homeTeam;
    this.goalPause = 2.5;
    this.phase     = 'GOAL_PAUSE';
  }

  // ── 하프타임 ────────────────────────────────────────────────

  _handleHalfTime() {
    this._log('하프타임! 팀이 진영을 바꿉니다.');
    this.homeTeam.flipDirection();
    this.awayTeam.flipDirection();
    this._setupKickoff(this.awayTeam);
  }

  // ── draw ────────────────────────────────────────────────────

  draw() {
    this.renderer.clear();
    this.renderer.drawPitch();
    this.renderer.drawPlayers(this._allPlayers());
    this.renderer.drawBall(this.ball);
  }

  // ── 헬퍼 ────────────────────────────────────────────────────

  _allPlayers() {
    return [...this.homeTeam.players, ...this.awayTeam.players];
  }

  /** team 선수 중 pos에 가장 가까운 선수를 반환한다 */
  _nearestTo(team, pos, excludeGK = false) {
    const pool = excludeGK ? team.outfieldPlayers : team.players;
    let best = null, bestD = Infinity;
    for (const p of pool) {
      const d = p.position.sub(pos).length();
      if (d < bestD) { bestD = d; best = p; }
    }
    return best;
  }

  /**
   * 선수가 볼을 가로챌 수 있는 예상 지점을 계산한다.
   * 볼 경로 위에서 선수가 도달 가능한 가장 빠른 지점을 선택한다.
   * 정지 볼이면 볼 위치 그대로 반환한다.
   *
   * TODO: 공중볼 낙하지점(포물선) 역산 로직으로 교체 예정
   */
  _interceptPoint(player, ball) {
    const spd = ball.speed();
    if (spd < 0.5) return ball.position.clone();

    const dir   = ball.velocity.normalize();
    const stopT = spd / BALL_FRICTION;

    for (let t = 0.1; t <= Math.min(stopT, 5.0); t += 0.1) {
      const traveled  = Math.max(0, spd * t - 0.5 * BALL_FRICTION * t * t);
      const futurePos = ball.position.add(dir.scale(traveled));
      if (player.position.sub(futurePos).length() <= player.maxSpeed * t * 1.05) {
        return futurePos;
      }
    }
    // 볼 최종 정지 지점
    return ball.position.add(dir.scale((spd * spd) / (2 * BALL_FRICTION)));
  }

  _goalYRange() {
    return [CY - GOAL_W / 2, CY + GOAL_W / 2];
  }

  // ── UI 헬퍼 ─────────────────────────────────────────────────

  formatTime() {
    const tot = Math.floor(this.matchTime);
    const m   = Math.floor(tot / 60);
    const s   = tot % 60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  _updateScoreboard() {
    document.getElementById('scoreHome').textContent = this.homeTeam.score;
    document.getElementById('scoreAway').textContent = this.awayTeam.score;
  }

  _updatePossessionBar() {
    const total = this.homeTeam.possessionTicks + this.awayTeam.possessionTicks;
    if (total === 0) return;
    const hp  = Math.round(this.homeTeam.possessionTicks / total * 100);
    const ap  = 100 - hp;
    const hEl = document.getElementById('possHome');
    const aEl = document.getElementById('possAway');
    if (hEl) { hEl.style.width = hp + '%'; hEl.textContent = hp + '%'; }
    if (aEl) { aEl.style.width = ap + '%'; aEl.textContent = ap + '%'; }
  }

  _log(msg) {
    if (!this._logEl) return;
    const el = document.createElement('div');
    el.textContent = `[${this.formatTime()}] ${msg}`;
    this._logEl.prepend(el);
    while (this._logEl.children.length > 60) this._logEl.lastChild.remove();
  }
}


// ================================================================
//  SECTION 9: GameLoop
//  requestAnimationFrame 기반 60fps 루프.
//  timeScale로 배속을 제어한다.
//  update()와 draw()를 명확히 분리해 물리와 렌더링을 독립적으로 테스트할 수 있다.
// ================================================================
class GameLoop {
  constructor({ update, draw }) {
    this._update   = update;
    this._draw     = draw;
    this.running   = false;
    this.timeScale = 2;
    this._lastTs   = null;
    this._rafId    = null;
    this._loop     = this._loop.bind(this);
    this.onTick    = null;   // 클락 갱신 콜백
  }

  start() {
    if (this.running) return;
    this.running = true;
    this._lastTs = null;
    this._rafId  = requestAnimationFrame(this._loop);
  }

  stop() {
    this.running = false;
    if (this._rafId) { cancelAnimationFrame(this._rafId); this._rafId = null; }
  }

  setTimeScale(ts) { this.timeScale = ts; }

  _loop(ts) {
    if (!this.running) return;
    if (this._lastTs === null) this._lastTs = ts;

    // dt 캡: 탭 비활성 복귀 시 200ms 이상의 dt를 방지
    const rawDt = Math.min((ts - this._lastTs) / 1000, 0.2);
    this._lastTs = ts;

    this._update(rawDt * this.timeScale);
    this._draw();
    if (this.onTick) this.onTick();

    this._rafId = requestAnimationFrame(this._loop);
  }
}


// ================================================================
//  SECTION 10: 진입점 (Entry Point)
//  DOM 준비 후 캔버스·Match·GameLoop를 연결하고 경기를 시작한다.
// ================================================================
window.addEventListener('DOMContentLoaded', () => {
  const canvas     = document.getElementById('field');
  canvas.width     = CW;
  canvas.height    = CH;

  const match      = new Match(canvas);

  const gameLoop   = new GameLoop({
    update: (dt) => match.update(dt),
    draw:   ()   => match.draw(),
  });

  // 클락·점유율·매치 정보 UI 갱신 콜백
  const clockEl = document.getElementById('clock');
  const phaseEl = document.getElementById('phaseLabel');
  const infoEl  = document.getElementById('matchInfo');
  const PHASE_LABELS = {
    KICKOFF:    '킥오프',
    IN_PLAY:    '경기 진행 중',
    GOAL_PAUSE: '⚽ 골!',
    FULL_TIME:  '경기 종료',
  };

  gameLoop.onTick = () => {
    if (clockEl) clockEl.textContent = match.formatTime();
    if (phaseEl) phaseEl.textContent = PHASE_LABELS[match.phase] ?? match.phase;
    match._updatePossessionBar();

    // 매치 인포 패널 갱신 (0.5초마다로 제한하면 성능 개선 가능)
    if (infoEl) {
      const total = match.homeTeam.possessionTicks + match.awayTeam.possessionTicks;
      const hp    = total ? Math.round(match.homeTeam.possessionTicks / total * 100) : 50;
      infoEl.innerHTML =
        `홈 점유율: <b>${hp}%</b><br>` +
        `어웨이 점유율: <b>${100 - hp}%</b><br>` +
        `경기 시간: <b>${match.formatTime()}</b>`;
    }
  };

  gameLoop.start();

  // ── UI 컨트롤 ──
  const btnPlay  = document.getElementById('btnPlay');
  const btnReset = document.getElementById('btnReset');
  const speedSel = document.getElementById('speedSelect');

  btnPlay.addEventListener('click', () => {
    if (gameLoop.running) {
      gameLoop.stop();
      btnPlay.textContent = '▶ 재생';
    } else {
      gameLoop.start();
      btnPlay.textContent = '일시정지';
    }
  });

  btnReset.addEventListener('click', () => {
    match.reset();
    match.draw();
  });

  speedSel.addEventListener('change', () => {
    gameLoop.setTimeScale(Number(speedSel.value));
  });
  gameLoop.setTimeScale(Number(speedSel.value));

  // 디버그용 전역 접근 (브라우저 콘솔에서 window.__match, window.__loop로 확인)
  window.__match = match;
  window.__loop  = gameLoop;
});
</script>
</body>
