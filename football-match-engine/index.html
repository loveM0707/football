      const away = player.position.sub(mate.position); // 동료 → 나 방향
      const d    = away.length();
      if (d < OTB_SEP_R && d > 0.1) {
        const strength = (OTB_SEP_R - d) / OTB_SEP_R;
        sepForce = sepForce.add(away.normalize().scale(strength * OTB_SEP_W));
      }
    }

    // ─ 힘4: 패스 길 열어주기 (Open Passing Lane Force) ─────────────
    // 볼 소유 동료 → 나 사이의 경로가 수비수에게 차단되어 있으면,
    // 패스 방향에 수직으로 이동해 빈 공간(수비수가 없는 쪽)으로 빠진다.
    let laneForce = Vector2D.zero();
    const owner   = this.ball.owner;  // ourTeamHasBall=true이면 non-null 보장
    if (owner && owner !== player) {
      const passVec  = player.position.sub(owner.position); // 소유자 → 나 방향
      const passDist = passVec.length();
      if (passDist > 1.0 && !this._isPathClear(owner.position, player.position, oppTeam)) {
        const norm  = passVec.normalize();
        // 패스 방향의 수직 벡터 두 후보
        const perpA = new Vector2D(-norm.y,  norm.x);
        const perpB = new Vector2D( norm.y, -norm.x);
        // 각 방향으로 2m 이동했을 때의 예상 위치에서 가장 가까운 수비수 거리 비교
        const testA = player.position.add(perpA.scale(2));
        const testB = player.position.add(perpB.scale(2));
        let minA = Infinity, minB = Infinity;
        for (const opp of oppTeam.players) {
          if (opp.role === 'GK') continue;
          minA = Math.min(minA, opp.position.sub(testA).length());
          minB = Math.min(minB, opp.position.sub(testB).length());
        }
        // 더 넓은 공간이 있는 방향(수비수에서 멀어지는 쪽)을 선택
        laneForce = (minA >= minB ? perpA : perpB).scale(OTB_LANE_W);
      }
    }

    // ─ 힘5: 침투 움직임 (Penetrating Run, 공격수 전용) ─────────────
    // 공격수(ST, LM, RM)에게 골대 방향 추가 전진 힘을 부여한다.
    // COUNTER 역할 중이면 힘을 TR_COUNTER_RUN_W 배로 증폭하여 역습 스프린트 연출.
    let runForce     = Vector2D.zero();
    const isAttacker = ['ST', 'LM', 'RM'].includes(player.role);
    // FORWARD_RUNNER로 배정된 선수는 이미 roleTarget(오프사이드 라인 뒤 안전 지점)이
    // anchor로 baseForce를 통해 적용되므로, 별도의 무조건 전진 힘은 중복 적용해 라인을
    // 넘어 침투하는 것을 막기 위해 생략한다.
    if (isAttacker && player.roleAssignment !== 'FORWARD_RUNNER') {
      const toGoal = oppGoalC.sub(player.position);
      if (toGoal.length() > 5) {
        const runMult = player.transitionRole === 'COUNTER' ? TR_COUNTER_RUN_W : OTB_RUN_W;
        runForce = toGoal.normalize().scale(runMult);
      }
    }

    // ── 합산 및 최종 속도 결정 ────────────────────────────────────────
    const totalForce = baseForce
      .add(evadeForce)
      .add(sepForce)
      .add(laneForce)
      .add(runForce);
    const forceLen = totalForce.length();

    if (forceLen > 0.05) {
      // 속도 배율: 앵커에서 멀수록 전속력, 가까울수록 세밀한 조정 속도
      const sf = anchorDist > TETHER_R ? 1.0
               : anchorDist > 8       ? 0.75
               : anchorDist > 3       ? 0.55
               :                        0.40;
      player.desiredVelocity = totalForce.normalize().scale(player.maxSpeed * sf);
      player.facingAngle     = totalForce.angle();
    } else {
      player.desiredVelocity = Vector2D.zero();
    }
  }

  /**
   * CHASING: 볼 또는 적 볼 소유자를 향해 전속력 압박.
   *
   * _pressRank에 따라 조향이 달라진다:
   *   -1 / 0 : 인터셉트 예상 지점으로 직진 (가장 가까운 압박자)
   *    1     : 인터셉트 지점 기준 +PR_FLANK_ANGLE(≈23°) 측면 선점
   *    2     : 인터셉트 지점 기준 -PR_FLANK_ANGLE 반대 측면 선점
   *
   * 전환 OUT:
   *   → DRIBBLING : 소유권 획득(_updateOwnership에서 hasBall=true)
   *   → RUNNING   : 다른 선수가 공을 소유하거나 chaser·presser 선정 해제됨
   */
  _stateChasing(player) {
    // 목표: 루즈볼이면 볼 인터셉트 지점, 적 소유 중이면 볼 소유자 위치
    const target = this.ball.owner
      ? this.ball.owner.position.clone()
      : this._interceptPoint(player, this.ball);

    const diff    = target.sub(player.position);
    const diffLen = diff.length();
    if (diffLen < 0.3) return;

    const rank = player._pressRank ?? -1;

    if (rank <= 0) {
      // 최근접 압박자 또는 루즈볼 추적자 — 직진
      player.desiredVelocity = diff.normalize().scale(player.maxSpeed);
      player.facingAngle     = diff.angle();
    } else {
      // 2·3번 압박자 — 측면 각도로 이동해 소유자의 탈출 경로를 막는다
      // rank 1 → +PR_FLANK_ANGLE, rank 2 → -PR_FLANK_ANGLE
      const angleOffset = PR_FLANK_ANGLE * (rank === 1 ? 1 : -1);
      const flankAngle  = diff.angle() + angleOffset;
      const flankDir    = Vector2D.fromAngle(flankAngle);

      // 2·3번은 전속력의 95%로 이동 (1번보다 살짝 느려 피치 모양 유지)
      player.desiredVelocity = flankDir.scale(player.maxSpeed * 0.95);
      player.facingAngle     = flankAngle;
    }
  }

  /**
   * DRIBBLING: 공 소유 중 킥 준비 카운트다운(KICK_DELAY) 동안 드리블.
   * 상대 골대 방향으로 전진하면서 킥 타이머를 누적한다.
   *
   * 전환 OUT (다음 틱 _evaluatePlayerState 에서 결정):
   *   → PASSING  : kickTimer >= KICK_DELAY && 앞쪽 패스 대상 존재
   *   → SHOOTING : kickTimer >= KICK_DELAY && 골대 SHOOT_DIST 이내 or 동료 없음
   *   → RUNNING  : 공을 잃음(hasBall=false)
   */
  _stateDribbling(player, ctx) {
    const { oppGoalC, oppTeam } = ctx;
    const toGoal = oppGoalC.sub(player.position);
    if (toGoal.length() < 0.3) { player.desiredVelocity = Vector2D.zero(); return; }
    const goalDir = toGoal.normalize();
    let nearest=null, nd=Infinity;
    for (const opp of oppTeam.players) if (opp.role!=='GK') { const d=opp.position.sub(player.position).length(); if(d<nd){nd=d;nearest=opp;} }
    let moveDir=goalDir;
    if (nearest && nd<4.5) {
      const away=player.position.sub(nearest.position).normalize();
      const side=new Vector2D(-goalDir.y,goalDir.x).scale((player.position.y<CY)?1:-1);
      moveDir=goalDir.scale(0.72).add(away.scale(0.65)).add(side.scale(0.25)).normalize();
    }
    if (player.actionDecision==='HOLD') moveDir=moveDir.scale(0.45);
    const spd=player.actionDecision==='HOLD'?player.maxSpeed*0.42:player.maxSpeed*0.82;
    player.desiredVelocity=moveDir.normalize().scale(spd);
    player.facingAngle=moveDir.angle();
    if (player.dribbleStartPosition) player.dribbleDistance=Math.max(player.dribbleDistance, player.position.sub(player.dribbleStartPosition).length());
  }

/**
   * PASSING: ��� 타이머 만료 후 동료에게 패스를 실행하는 순간 상태.
   * ���이 실행되는 즉시 hasBall=false, kickTimer=0 → 다음 ��에 RUNNING 전환.
   *
   * 전환 OUT:
   *   → RUNNING : ��� 실행 완료 (��시)
   */
  _statePassing(player, ctx) {
    const { oppGoalC } = ctx;
    // GK 클리어런스인 경우 isClearance=true로 강한 전방 걷어내기 수행
    if (player._clearanceTarget) {
      this._executeKick(player, player._clearanceTarget, false, true);
      player._clearanceTarget = null;
    } else {
      const target = player._passPlan?.targetPosition ?? player._passTarget?.position ?? oppGoalC;
      this._executeKick(player, target, false);
      player._passPlan = null; player._passTarget = null;
    }
  }

  /**
   * SHOOTING: 킥 타이머 만료 후 골대를 향해 슈팅하는 순간 상태.
   * 킥 실행 후 즉시 RUNNING 전환.
   *
   * 전환 OUT:
   *   → RUNNING : 킥 실행 완료 (즉시)
   */
  _stateShooting(player, ctx) {
    const { oppGoalC } = ctx;
    this._executeKick(player, oppGoalC, true);
  }

  /**
   * MARKING: 적 공격수(마크 대상)를 바짝 따라다니며 패스 루트를 차단.
   * 마크 대상과의 거리를 좁혀 공간을 압박하되, 과도하게 끌려나가지 않도록
   * 자기 기본 위치에서 MARKING_RADIUS 이상 벗어나지 않는다.
   *
   * 전환 OUT:
   *   → TACKLING : 적이 공을 소유하고 TACKLE_RADIUS 이내로 진입
   *   → RUNNING  : 적이 MARKING_RADIUS 밖으로 이동
   *   → CHASING  : 루즈볼 최근접 선수로 선정됨
   */
  _stateMarking(player, ctx) {
    const target = player._markTarget;
    if (!target) { player.state='RUNNING'; return; }
    const ownGoalX = player.team.attackingDir===1?0:PITCH_LEN;
    const goalDir = new Vector2D(ownGoalX,CY).sub(target.position).normalize();
    let desired = target.position.add(goalDir.scale(1.6));
    const zone = player.tacticalPosition ?? player.basePosition;
    if (desired.sub(zone).length() > MAX_MARK_DEVIATION_FROM_ZONE) {
      desired = zone.add(desired.sub(zone).normalize().scale(MAX_MARK_DEVIATION_FROM_ZONE));
    }
    const diff=desired.sub(player.position);
    player.desiredVelocity=diff.length()>0.4?diff.normalize().scale(player.maxSpeed*0.72):Vector2D.zero();
    player.facingAngle=target.position.sub(player.position).angle();
  }

  /** 볼 소유자를 무작정 돌진하지 않고 골문 방향을 막으며 지연시킨다. */
  _stateJockey(player, ctx) {
    const owner=this.ball.owner;
    if (!owner || owner.team===player.team) { player.state='RUNNING'; return; }
    const ownGoalX=player.team.attackingDir===1?0:PITCH_LEN;
    const goal=new Vector2D(ownGoalX,CY);
    const goalSide=goal.sub(owner.position).normalize();
    const target=owner.position.add(goalSide.scale(JOCKEY_DISTANCE));
    const diff=target.sub(player.position);
    const d=player.position.sub(owner.position).length();
    if (d<=TACKLE_EXEC_R*1.15 && owner.velocity.length()>1.0) { player.state='TACKLING'; return; }
    player.desiredVelocity=diff.length()>0.25?diff.normalize().scale(player.maxSpeed*(d>5?0.9:0.62)):Vector2D.zero();
    player.facingAngle=owner.position.sub(player.position).angle();
  }

  /**
   * TACKLING: 볼 소유 적에게 빠르게 접근, TACKLE_EXEC_R 이내에서 1v1 경합 시도.
   *
   * 경합(Opposed Check):
   *   수비수 태클 점수 = tackling(태클 기술) + strength(몸싸움) + 주사위(0~50)
   *   공격수 방어 점수 = control(드리블/민첩)  + strength(몸버팀) + 주사위(0~50)
   *   → 수비수 점수 > 공격수 점수 : 태클 성공, 소유권 탈취
   *   → 공격수 점수 ≥ 수비수 점수 : 태클 실패, 수비수 0.5초 쿨다운 페널티
   *
   * 전환 OUT:
   *   → DRIBBLING : 태클 성공 → _giveOwnership 으로 hasBall=true
   *   → RUNNING   : 태클 실패 or 적이 TACKLE_RADIUS 밖으로 이동
   */
  _stateTackling(player, ctx) {
    const ballOwner = this.ball.owner;
    if (!ballOwner || ballOwner.team === player.team) {
      player.state = 'RUNNING';
      return;
    }

    const toEnemy = ballOwner.position.sub(player.position);
    const dist    = toEnemy.length();

    if (dist > TACKLE_RADIUS * 1.2) {
      player.state = 'RUNNING';
      return;
    }

    if (dist > TACKLE_EXEC_R) {
      // 접근 단계: 볼 소유 적을 향해 전속력으로 달린다
      player.desiredVelocity = toEnemy.normalize().scale(player.maxSpeed);
      player.facingAngle     = toEnemy.angle();
    } else {
      // 태클 실행 구간: 쿨다운이 없을 때만 경합 판정
      if (!player._tackleCooldown || player._tackleCooldown <= 0) {

        // ── 1v1 Opposed Check ──────────────────────────────────────────
        // 수비수: tackling(태클 기술) + strength(몸싸움) + 주사위
        const defScore = player.attrs.tackling + player.attrs.strength + Math.random() * 50;
        // 공격수: control(드리블/민첩) + strength(몸버팀) + 주사위
        const attScore = ballOwner.attrs.control + ballOwner.attrs.strength + Math.random() * 50;
        // ──────────────────────────────────────────────────────────────

        if (defScore > attScore) {
          // 태클 성공: 소유권 탈취
          this._giveOwnership(player);
          player.kickTimer = 0;
          this._log(`${player.name}의 환상적인 태클! ${ballOwner.name}의 돌파를 저지합니다.`);
        } else {
          // 태클 실패: 공격수가 몸을 지켜냄 → 0.5초 쿨다운 페널티
          player._tackleCooldown = 0.5;
        }
      }

      // 쿨다운 중이면 속도 감소 (미끄러지듯 멈춤)
      if (player._tackleCooldown > 0) {
        player._tackleCooldown -= ctx.dt;
        player.desiredVelocity = player.desiredVelocity.scale(0.3);
      }
    }
  }

  /**
   * GK_GUARD: 골키퍼 전용.
   * 자기 골대-볼 연결선 위에 포지셔닝, 슈팅 예측 다이빙, 페널티 박스 내 볼 추적.
   *
   * 전환 OUT: 없음 (GK는 항상 이 상태)
   */
  _stateGkGuard(player) {
    const attackDir  = player.team.attackingDir;
    const ownGoalX   = attackDir === 1 ? 0 : PITCH_LEN;
    const [topY, botY] = this._goalYRange();
    const goalCenterY  = (topY + botY) / 2;
    const goalCenter   = new Vector2D(ownGoalX, goalCenterY);
    const ballPos      = this.ball.position;

    // ── GK 볼 소유 중: 골문 앞 배급 대기 (GK_HOLD_DELAY 중) ─────────
    if (player.hasBall) {
      const holdPos = new Vector2D(ownGoalX + attackDir * 1.5, goalCenterY);
      const diff = holdPos.sub(player.position);
      if (diff.length() > 0.3) {
        player.desiredVelocity = diff.normalize().scale(player.maxSpeed * 0.5);
      } else {
        player.desiredVelocity = Vector2D.zero();
      }
      player.facingAngle = ballPos.sub(player.position).angle();
      return;
    }

    // ── 슈팅 공 예측 다이빙 ──────────────────────────────────────────
    if (this.ball.isShot && Math.abs(this.ball.velocity.x) > 0.1) {
      const vx = this.ball.velocity.x;
      const t  = (ownGoalX - ballPos.x) / vx;
      if (t > 0 && t < 2.5) {
        const predY    = Math.max(topY - 3, Math.min(botY + 3,
                          ballPos.y + this.ball.velocity.y * t));
        const divePos  = new Vector2D(ownGoalX + attackDir * 0.5, predY);
        const diff     = divePos.sub(player.position);
        player.desiredVelocity = diff.normalize().scale(player.maxSpeed);
        player.facingAngle     = diff.angle();
        return;
      }
    }

    // ── 페널티 박스 내 루즈볼: GK 직접 추격 ──────────────────────────
    if (!this.ball.owner && !this.ball.isShot) {
      if (Math.abs(ballPos.x - ownGoalX) < PEN_BOX_L) {
        const diff = ballPos.sub(player.position);
        if (diff.length() > 0.3) {
          player.desiredVelocity = diff.normalize().scale(player.maxSpeed);
          player.facingAngle     = diff.angle();
        }
        return;
      }
    }

    // ── 비섹터 라인 포지셔닝 (각도 좁히기) ──────────────────────────
    // 위협도: 볼이 페널티 스팟에 가까울수록 1, 멀수록 0
    const ballDistToGoal = ballPos.sub(goalCenter).length();
    const penBoxEdgeDist = Math.max(0, ballDistToGoal - PEN_BOX_L);
    const threat  = Math.max(0, 1 - penBoxEdgeDist / SHOOT_DIST);
    const depth   = GK_STEP_MIN + threat * (GK_STEP_MAX - GK_STEP_MIN);

    // 비섹터 방향: 골문 중심 → 볼 방향 단위 벡터
    const toBall    = ballPos.sub(goalCenter);
    const toBallLen = toBall.length();
    const bx = toBallLen > 0.01 ? toBall.x / toBallLen : attackDir;
    const by = toBallLen > 0.01 ? toBall.y / toBallLen : 0;

    // 목표점: 골문 중심 + 비섹터 방향 × depth
    const rawX = goalCenter.x + bx * depth;
    const rawY = goalCenter.y + by * depth;

    // X 클램핑: 골라인 ~ GK_STEP_MAX 이내
    const clampedX = attackDir === 1
      ? Math.max(ownGoalX + GK_STEP_MIN, Math.min(ownGoalX + GK_STEP_MAX, rawX))
      : Math.min(ownGoalX - GK_STEP_MIN, Math.max(ownGoalX - GK_STEP_MAX, rawX));
    // Y 클램핑: 골대 폭 ± 2m
    const clampedY = Math.max(topY - 2, Math.min(botY + 2, rawY));

    const target = new Vector2D(clampedX, clampedY);
    const diff   = target.sub(player.position);
    const dist   = diff.length();
    if (dist > 0.3) {
      player.desiredVelocity = diff.normalize().scale(player.maxSpeed * 0.70);
    } else {
      player.desiredVelocity = Vector2D.zero();
    }
    player.facingAngle = ballPos.sub(player.position).angle();
  }

  // ── FSM 헬퍼 ─────────────────────────────────────────────────

  /**
   * 패스 대상 탐색 — 스코어링 시스템.
   *
   * 각 동료에 대해 다음 요소를 점수로 환산한다:
   *   [가점A] 공격 진출도: 상대 골대에 가까울수록 가점 (최대 ~52점)
   *   [가점B] 오픈 스페이스: 주변 수비수가 OPEN_SPACE_R(4m) 이상 없으면 최대 +30점
   *   [감점]  거리 패널티: 패스가 멀수록 감점 (인터셉트 위험 반영)
   *   [제외]  패스 경로 차단: _isPathClear가 false인 동료는 후보에서 제외
   *
   * 1차 탐색: 공격 방향으로 2m 이상 앞선 동료만 대상.
   * 2차(폴백): 앞쪽 동료가 모두 막혀있으면 뒤쪽(백패스) 동료도 탐색
   *            (공격 진출도 가중치를 낮춰 패널티 적용).
   *
   * @param {Player} player  - 공 소유 선수
   * @param {Team}   oppTeam - 상대 팀 (경로 차단 판정에 사용)
   * @returns {Player|null}
   */
  _findPassPlan(player, oppTeam) {
    const mates=player.team.players.filter(p=>p!==player && p.role!=='GK');
    const dir=player.team.attackingDir;
    const goalX=dir===1?PITCH_LEN:0;
    let best=null;
    for (const mate of mates) {
      const dist=mate.position.sub(player.position).length();
      const leadTime=Math.min(0.65, dist/18);
      const lead=mate.position.add(mate.velocity.scale(leadTime));
      if (dist<3 || dist>ATTR_VISION_MAX) continue;
      if (!this._isPathClear(player.position, lead, oppTeam)) continue;
      const passDir=lead.sub(player.position).normalize();
      const facing=Vector2D.fromAngle(player.facingAngle||0);
      const dot=Math.max(-1,Math.min(1,facing.x*passDir.x+facing.y*passDir.y));
      const angle=Math.acos(dot);
      const forward=(lead.x-player.position.x)*dir;
      let minOpp=Infinity; for(const o of oppTeam.players) if(o.role!=='GK') minOpp=Math.min(minOpp,o.position.sub(lead).length());
      const utility=forward*2 + Math.min(minOpp,8)*4 - dist*0.9 - Math.max(0,angle-Math.PI/3)*18;
      if(!best || utility>best.utility) best={receiver:mate,targetPosition:lead,utility,passDistance:dist,passAngle:angle};
    }
    return best;
  }

  _findPassTarget(player, oppTeam) {
    const mates = player.team.players.filter(p => p !== player && p.role !== 'GK');
    if (mates.length === 0) return null;

    const oppGoalX = player.team.attackingDir === 1 ? PITCH_LEN : 0;

    // 앞쪽 동료: 공격 방향으로 2m 이상 전진해 있는 선수
    const isForward = (p) => player.team.attackingDir === 1
      ? p.position.x > player.position.x + 2
      : p.position.x < player.position.x - 2;

    const forwardMates = mates.filter(isForward);
    // 1차 탐색 풀: 앞쪽이 있으면 앞쪽만, 없으면 전체 동료
    const primaryPool = forwardMates.length > 0 ? forwardMates : mates;

    let bestScore  = -Infinity;
    let bestTarget = null;

    const visionR = ATTR_VISION_MIN + (player.attrs.vision / 100) * (ATTR_VISION_MAX - ATTR_VISION_MIN);

    // 공통 스코어링 로직 (goalAdvanceWeight: 공격 진출도 가중치)
    const scoreCandidate = (mate, goalAdvanceWeight) => {
      // ─── 시야 반경 체크: 범위 밖 동료는 제외 ─────────────────────────
      if (mate.position.sub(player.position).length() > visionR) return;
      // ─── 패스 경로 차단 체크: 수비수가 선분 2m 이내면 제외 ───────────
      if (!this._isPathClear(player.position, mate.position, oppTeam)) return;

      let score = 0;

      // [가점A] 공격 진출도: 골대까지 거리가 짧을수록 유리 (최대 ~52점)
      const distToGoal = Math.abs(mate.position.x - oppGoalX);
      score += (PITCH_LEN - distToGoal) * goalAdvanceWeight;

      // [가점B] 오픈 스페이스: 주변 수비수 최단 거리 기반 (최대 +30점)
      //   OPEN_SPACE_R(4m) 이상이면 최대, 이하면 선형 감소
      let minOppDist = Infinity;
      for (const opp of oppTeam.players) {
        const d = opp.position.sub(mate.position).length();
        if (d < minOppDist) minOppDist = d;
      }
      score += Math.min(minOppDist, OPEN_SPACE_R) * (30 / OPEN_SPACE_R);

      // [감점] 거리 패널티: 멀수록 인터셉트 위험이 높아짐
      const passDist = mate.position.sub(player.position).length();
      score -= passDist * 0.8;

      if (score > bestScore) { bestScore = score; bestTarget = mate; }
    };

    // ─── 1차: 앞쪽(공격 방향) 동료 탐색 ──────────────────────────────
    for (const mate of primaryPool) scoreCandidate(mate, 0.5);

    // ─── 2차(폴백): 앞쪽이 모두 막혔을 때 백패스 동료도 탐색 ────────────
    if (!bestTarget && forwardMates.length > 0) {
      const backMates = mates.filter(m => !forwardMates.includes(m));
      for (const mate of backMates) {
        scoreCandidate(mate, 0.2); // 백패스는 공격 진출도 가중치 낮게 적용
      }
    }

    return bestTarget; // null이면 유효한 패스 대상 없음
  }

  /**
   * 패스/슈팅 경로가 수비수에게 차단되어 있는지 확인한다.
   *
   * 점-선분 최단거리 공식:
   *   t = clamp( (P−A)·(B−A) / |B−A|², 0, 1 )
   *   closest = A + t*(B−A)
   *   dist = |P − closest|
   *
   * @param {Vector2D} startPos  - 경로 출발점 (공 소유 선수 위치)
   * @param {Vector2D} endPos    - 경로 도착점 (동료 또는 골대 중심)
   * @param {Team}     oppTeam   - 상대 팀 (수비수 목록)
   * @param {number}   blockDist - 차단 판정 최소 거리 (기본값: PASS_BLOCK_DIST)
   * @returns {boolean} true = 경로 열림, false = 경로 차단됨
   */

  /** [버그 수정] GK가 자기 팀 페널티 박스 내부에 있는지 판정한다.
   * 페널티 박스 밖으로 나온 GK는 일반 필드 플레이어처럼 태클·추격 허용.
   */
  _isInOwnPenaltyBox(gkPlayer) {
    const pos = gkPlayer.position;
    const halfW = PEN_BOX_W / 2; // 20.16m
    if (pos.y < CY - halfW || pos.y > CY + halfW) return false;
    // attackingDir === 1: 오른쪽 공격 → 자기 골은 왼쪽(x=0) 쪽
    if (gkPlayer.team.attackingDir === 1) return pos.x <= PEN_BOX_L;
    return pos.x >= PITCH_LEN - PEN_BOX_L;
  }

  _isPathClear(startPos, endPos, oppTeam, blockDist = PASS_BLOCK_DIST) {
    const seg      = endPos.sub(startPos);  // A→B 선분 벡터
    const segLenSq = seg.dot(seg);          // |AB|² (나눗셈 최적화)

    for (const opp of oppTeam.players) {
      if (opp.role === 'GK') continue;  // GK는 패스 차단 판정에서 제외

      const toOpp = opp.position.sub(startPos);  // A→P 벡터

      // t: 선분 위에서 수비수(P)에 가장 가까운 점의 매개변수 (0=A끝, 1=B끝)
      const t = segLenSq > 1e-6
        ? Math.max(0, Math.min(1, toOpp.dot(seg) / segLenSq))
        : 0;

      // 선분 위의 최근접점과 수비수 사이 거리
      const closest = startPos.add(seg.scale(t));
      const dist    = opp.position.sub(closest).length();

      if (dist < blockDist) return false;  // 수비수가 경로를 막고 있음
    }
    return true;  // 모든 수비수가 경로 밖 → 경로 열림
  }

  /**
   * 마크 대상 탐색.
   * 자신의 MARKING_RADIUS 이내에 있는 상대 팀 선수(GK 제외) 중 가장 가까운 선수.
   * 볼이 적 팀에 있거나 자기 진영에서 루즈볼 상황일 때만 활성화된다.
   * 없으면 null.
   */
  _findMarkTarget(player, oppTeam) {
    // 자기 팀이 볼을 소유 중이면 마킹 불필요
    if (this.ball.owner && this.ball.owner.team === player.team) return null;

    let best = null, bestD = MARKING_RADIUS;
    for (const opp of oppTeam.players) {
      if (opp.role === 'GK') continue;
      const d = opp.position.sub(player.position).length();
      if (d < bestD) { bestD = d; best = opp; }
    }
    return best;
  }

/**
   * ��� 실행 유��리티.
   * target: 목표 위치(Vector2D) — 동료 위치 또는 골대 중심
   * isShot: true이면 슈팅 (GK 다이�� 판정에 사용)
   * isClearance: true이면 골키퍼 클리어런스(강한 전방 걷어내기)
   *
   * 거리 기준:
   *   < LOFT_DIST → 지상 ���
   *   ≥ LOFT_DIST → 로�� ��� (vz 상한 7.5 m/s)
   */
  _executeKick(player, target, isShot = false, isClearance = false) {
    const toTarget=target.sub(player.position);
    const dist=toTarget.length();
    const tech=(isShot?player.attrs.shooting:player.attrs.passing)/100;
    const baseSpread=isShot?SHOT_BASE_SPREAD:PASS_BASE_SPREAD;
    const spread=baseSpread*(1.25-tech*0.65) + (isShot?dist*0.002:dist*0.0008);
    const ang=toTarget.angle()+(Math.random()-0.5)*2*spread;
    if (isClearance) {
      this.ball.loftKick(Vector2D.fromAngle(ang, Math.min(BALL_MAX_SPEED,28)), 9, player, false);
    } else if (isShot) {
      const spd=Math.min(BALL_MAX_SPEED,18+tech*10);
      this.ball.kick(Vector2D.fromAngle(ang,spd),player,true);
    } else {
      const friction=BALL_FRICTION;
      const desiredStop=Math.max(dist+1,4);
      const spd=Math.min(18, Math.max(7, Math.sqrt(2*friction*desiredStop)));
      if (dist>=24) this.ball.loftKick(Vector2D.fromAngle(ang,spd*0.88), Math.min(6,2+(dist-24)*0.08),player,false);
      else this.ball.kick(Vector2D.fromAngle(ang,spd),player,false);
    }

    // ── 패스 순간 오프사이드 스냅샷 ──────────────────────────────────────
    // 슈팅은 오프사이드 적용 안 함; 패스일 때만 스냅샷 기록
    if (!isShot) {
      const attackingDir = player.team.attackingDir;
      const defendTeam   = player.team === this.homeTeam ? this.awayTeam : this.homeTeam;
      const defXValues   = defendTeam.players.map(p => p.position.x);

      // 2번째로 앞선 수비수 X 좌표 = 오프사이드 라인
      // (1번째 = 골키퍼, 2번째 = 마지막 필드 수비수)
      let offsideLineX;
      if (attackingDir === 1) {
        // 공격팀이 오른쪽으로 공격: 수비수 X 내림차순, index[1]이 2번째로 높은 X
        const sorted = [...defXValues].sort((a, b) => b - a);
        offsideLineX = sorted[1] ?? sorted[0];
      } else {
        // 공격팀이 왼쪽으로 공격: 수비수 X 오름차순, index[1]이 2번째로 낮은 X
        const sorted = [...defXValues].sort((a, b) => a - b);
        offsideLineX = sorted[1] ?? sorted[0];
      }

      this.ball.offsideLineX = offsideLineX;
      this.ball.passTeam     = player.team;
      // 패서 본인 제외, GK 제외, 오프사이드 위치 선수 id 기록
      this.ball.offsidePlayers = player.team.players
        .filter(p => p !== player && p.role !== 'GK')
        .filter(p => attackingDir === 1
          ? p.position.x > offsideLineX
          : p.position.x < offsideLineX)
        .map(p => p.id);
    } else {
      // 슈팅은 오프사이드 무관 — 스냅샷 초기화
      this.ball.offsideLineX   = null;
      this.ball.offsidePlayers = [];
      this.ball.passTeam       = null;
    }

    player.hasBall   = false;
    this.ball.owner  = null;
    player.kickTimer = 0;
    player.actionDecision = null;
    player.actionCommitUntil = 0;
    player.dribbleStartPosition = null;
    player.dribbleDistance = 0;
    // 킥 완료 → RUNNING 으로 즉시 전환 (다음 틱 _evaluatePlayerState 재평가)
    player.state     = 'RUNNING';
  }

  // ── 선수 물리 ────────────────────────────────────────────────

  /**
   * 선형 가속도 모델로 선수를 이동시킨다.
   * velocity → desiredVelocity 로 가속도(PLAYER_ACCEL) 제한 내 수렴.
   */
  _movePlayer(player, dt) {
    const diff    = (player.desiredVelocity ?? Vector2D.zero()).sub(player.velocity);
    const maxDv   = P_ACCEL * dt;
    const diffLen = diff.length();

    player.velocity = diffLen <= maxDv
      ? (player.desiredVelocity ?? Vector2D.zero()).clone()
      : player.velocity.add(diff.normalize().scale(maxDv));

    const spd = player.velocity.length();
    if (spd > player.maxSpeed) player.velocity = player.velocity.normalize().scale(player.maxSpeed);
    player.updateStamina(spd, dt);

    player.position = player.position.add(player.velocity.scale(dt));

    // 피치 경계 클램핑
    player.position.x = Math.max(0.5, Math.min(PITCH_LEN - 0.5, player.position.x));
    player.position.y = Math.max(0.5, Math.min(PITCH_WID - 0.5, player.position.y));
  }

  // ── 볼 물리 ─────────────────────────────────────────────────

  /**
   * 선형 마찰 감속 (잔디 저항).
   *   v(t) = v0 − μ·t  → 완전 정지까지 부드럽게 감속한다.
   *
   * TODO: 공중볼 포물선 확장
   *   if (ball.height > 0) { ball.verticalVelocity -= GRAVITY * dt; ... }
   */
  _updateBallPhysics(dt) {
    const ball = this.ball;

    // ━━ Z축 (높이·중력) 시뮬레이션 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    if (ball.height > 0 || ball.verticalVelocity !== 0) {
      // 중력 적용: 매 프레임 수직 속도에서 GRAVITY * dt 만큼 뺀다 (아래로 당김)
      ball.verticalVelocity -= GRAVITY * dt;

      // 높이 갱신: vz * dt 만큼 올라가거나 내려간다
      ball.height += ball.verticalVelocity * dt;

      // 지면 충돌: height 가 0 이하로 내려가면 바닥에 닿은 것
      if (ball.height <= 0) {
        ball.height = 0;

        // 수직 속도 방향 반전 + 에너지 감쇠 (바운스)
        ball.verticalVelocity = -ball.verticalVelocity * BALL_BOUNCE_Z;

        // 완전 착지 판정: 바운스 후 속도가 임계값 이하면 Z운동을 완전히 멈춘다
        //   (작은 진동이 무한히 반복되는 현상을 방지)
        if (Math.abs(ball.verticalVelocity) < BALL_MIN_VZ) {
          ball.height           = 0;
          ball.verticalVelocity = 0;
        }
      }
    }

    // ━━ 수평 마찰 감속 (Constant Deceleration / Rolling Resistance) ━━━━━━

    // ① 속력(스칼라) 계산: speed = √(vx² + vy²)  [피타고라스]
    let speed = ball.speed();

    // ── 버그 수정 4: 슈팅(isShot=true)일 때 마찰 계수 감소 ──
    // 파워 슈팅이 끝까지 빠르게 날아가도록 공기/지면 저항 낮��
    const isPowerShot = ball.isShot && speed > 15; // 일정 속도 이상 슈팅만 적용
    const baseFriction = ball.height > 0
      ? BALL_FRICTION * 0.4   // 공중 — 공기 저항
      : BALL_FRICTION + Math.max(0, 3 - speed) * 0.9;        // 지면 — 저속에서 더 강한 구름 저항
    const frictionCoeff = isPowerShot
      ? baseFriction * 0.5    // 슈팅: 마찰 50%로 감소 (더 멀리, 더 빠르게)
      : baseFriction;         // 일반 패스/드리블: 기존 마찰 유지

    // [버그 수정] 지수 감속(Exponential Drag) 적용: 아이스 스케이팅 효과(공이 너무 오래 구르는 현상) 방지
    // 선형 마찰만으로는 저속 구간에서 공이 거의 멈추지 않아 현실감이 낮아지는 문제를 보완
    ball.velocity = ball.velocity.scale(0.975);
    speed = ball.velocity.length(); // 지수 감속 후 속력 재계산

    // ④ 완전 정지 조건: 속력이 이번 프레임 감속량 이하이면 즉시 0으로 고정
    if (speed <= frictionCoeff * dt) {
      ball.velocity = Vector2D.zero();
      if (ball.kickLockTimer > 0) ball.kickLockTimer = Math.max(0, ball.kickLockTimer - dt);
      ball.position = ball.position.add(ball.velocity.scale(dt)); // 위치는 그대로
      return;
    }

    // ② 일정량 감속: Δv = frictionCoeff × dt
    const decel    = frictionCoeff * dt;
    const newSpeed = speed - decel;

    // ③ 방향 유지: 단위벡터(normalize) × 새 속력
    ball.velocity = ball.velocity.normalize().scale(newSpeed);

    // 최고 속도 상한 클램핑 (킥 직후 과속 방지)
    if (newSpeed > BALL_MAX_SPEED) {
      ball.velocity = ball.velocity.normalize().scale(BALL_MAX_SPEED);
    }

    // 위치 갱신
    ball.position = ball.position.add(ball.velocity.scale(dt));

    if (ball.kickLockTimer > 0) ball.kickLockTimer = Math.max(0, ball.kickLockTimer - dt);
  }

  /**
   * 볼을 소유 선수의 발 앞에 붙인다.
   * 선수가 회전해도 공이 발에 고정되어 드리블이 자연스럽게 표현된다.
   */
  _attachBallToFoot(player) {
    const foot = Vector2D.fromAngle(player.facingAngle, 0.9);
    this.ball.position = player.position.add(foot);
    this.ball.velocity = player.velocity.clone();
  }

  // ── 소유권 ──────────────────────────────────────────────────

  /**
   * 루즈볼 소유권 판정.
   * 볼 제어 반경 이내 선수를 모두 수집한 뒤:
   *   - 1명 → 즉시 소유권 부여
   *   - 2명 이상 + 서로 다른 팀 → 루즈볼 경합(Duel): _calculateDuelScore 승자가 획득
   *   - 2명 이상 + 같은 팀만    → 가장 가까운 동료가 소유
   * 공이 PLAYER_HEIGHT 이상 공중에 있으면 소유 불가.
   */
  _updateOwnership(dt) {
    if (this.ball.owner) return;

    // 공중볼: Z축 분리 상태 → 소유 불가
    if (this.ball.height >= PLAYER_HEIGHT) return;

    // ── GK 선방 선처리: 슈팅 중 자기 골 방향으로 향할 때 GK_SAVE_RADIUS 이내이면 선방 판정 ──
    if (this.ball.isShot) {
      for (const team of [this.homeTeam, this.awayTeam]) {
        const gk = team.players.find(p => p.role === 'GK');
        if (!gk) continue;
        // 볼이 이 팀의 자기 골 방향으로 향하는지 확인 (velocity.x * attackingDir < 0)
        if (this.ball.velocity.x * team.attackingDir >= -0.5) continue;
        const d = gk.position.sub(this.ball.position).length();
        if (d < GK_SAVE_RADIUS) {
          this._attemptSave(gk);
          return;
        }
      }
    }

    // 제어 반경 이내 선수 전체 수집
    const candidates = [];
    for (const p of this._allPlayers()) {
      if (this.ball.kickLockTimer > 0 && p === this.ball.kicker) continue;
      const ctrlR = ATTR_CTRL_MIN + (p.attrs.control / 100) * (ATTR_CTRL_MAX - ATTR_CTRL_MIN);
      const d = p.position.sub(this.ball.position).length();
      if (d < ctrlR) candidates.push({ player: p, dist: d });
    }

    if (candidates.length === 0) return;

    // 오프사이드 체크 헬퍼: 특정 선수가 오프사이드 위치에 있는지 확인
    const isOffside = (p) =>
      this.ball.offsideLineX !== null &&
      this.ball.passTeam !== null &&
      p.team === this.ball.passTeam &&
      this.ball.offsidePlayers.includes(p.id);

    // 오프사이드 선언 헬퍼: 수비팀 최근접 아웃필드 선수에게 볼 이전
    const declareOffside = (offender) => {
      this._log(`🚩 오프사이드 반칙! ${offender.name} — 수비팀 볼 소유`);
      const defendTeam = offender.team === this.homeTeam ? this.awayTeam : this.homeTeam;
      const nearest = defendTeam.players
        .filter(p => p.role !== 'GK')
        .reduce((best, p) => {
          const d = p.position.sub(this.ball.position).length();
          return (!best || d < best.d) ? { p, d } : best;
        }, null);
      this.ball.offsideLineX   = null;
      this.ball.offsidePlayers = [];
      this.ball.passTeam       = null;
      this._startRestart('OFFSIDE_FREE_KICK', defendTeam, offender.position.clone());
    };

    // 1명이면 경합 없이 즉시 소유 (오프사이드 체크 포함)
    if (candidates.length === 1) {
      const sole = candidates[0].player;
      if (isOffside(sole)) { declareOffside(sole); return; }
      this._giveOwnership(sole);
      return;
    }

    // 2명 이상 — 팀 분포 확인
    const teams = new Set(candidates.map(c => c.player.team));
    if (teams.size === 1) {
      // 같은 팀끼리만: 가장 가까운 선수 소유 (오프사이드 체크 포함)
      candidates.sort((a, b) => a.dist - b.dist);
      const closest = candidates[0].player;
      if (isOffside(closest)) { declareOffside(closest); return; }
      this._giveOwnership(closest);
      return;
    }

    // ── 루즈볼 경합 (Loose Ball Duel) ──
    // 각 후보에 대해 strength + control + 주사위(0~50) 로 경합 점수 산출
    let winner = null, topScore = -Infinity;
    for (const { player } of candidates) {
      const score = this._calculateDuelScore(player);
      if (score > topScore) { topScore = score; winner = player; }
    }

    // 경합 로그: 복수의 선수가 경합했을 때만 기록
    const rivalTeamInvolved = candidates.some(c => c.player.team !== winner.team);
    if (rivalTeamInvolved) {
      this._log(`치열한 볼 경합! ${winner.name}이(가) 소유권을 따냅니다.`);
    }

    // ── 오프사이드 판정 ────────────────────────────────────────────────────
    // 패스 수신자가 패스 순간 오프사이드 위치에 있었으면 반칙 선언
    if (
      this.ball.offsideLineX !== null &&
      this.ball.passTeam !== null &&
      winner.team === this.ball.passTeam &&
      this.ball.offsidePlayers.includes(winner.id)
    ) {
      this._log(`🚩 오프사이드 반칙! ${winner.name} — 수비팀 볼 소유`);
      // 수비팀 최근접 아웃필드 선수에게 볼 지급
      const defendTeam = winner.team === this.homeTeam ? this.awayTeam : this.homeTeam;
      const nearest = defendTeam.players
        .filter(p => p.role !== 'GK')
        .reduce((best, p) => {
          const d = p.position.sub(this.ball.position).length();
          return (!best || d < best.d) ? { p, d } : best;
        }, null);
      // 스냅샷 초기화 후 소유권 이전
      this.ball.offsideLineX   = null;
      this.ball.offsidePlayers = [];
      this.ball.passTeam       = null;
      this._startRestart('OFFSIDE_FREE_KICK', defendTeam, winner.position.clone());
      return;
    }

    // 오프사이드 아님 — 정상 소유권 이전 후 스냅샷 초기화
    this.ball.offsideLineX   = null;
    this.ball.offsidePlayers = [];
    this.ball.passTeam       = null;
    this._giveOwnership(winner);
  }

  /**
   * 경합(Duel) 점수 산출.
   * strength(몸싸움) + control(볼 제어/민첩성) + 무작위 주사위(0~50)
   * @param {Player} player
   * @returns {number}
   */
  _calculateDuelScore(player) {
    return player.attrs.strength + player.attrs.control + Math.random() * 50;
  }

  /**
   * GK 선방 판정 (슈팅 전용, 능력치 기반).
   * gkPower = (control + positioning) / 2
   * speedPenalty: 볼 속도 8m/s 초과분에 비례
   * 결과: catch(완전 선방) / deflect(편향) / miss(실패)
   */
  _attemptSave(gk) {
    const speed        = this.ball.velocity.length();
    const speedPenalty = Math.max(0, (speed - 8) * 1.5);
    const gkPower      = (gk.attrs.control + gk.attrs.positioning) / 2;
    const roll         = Math.random() * 100;

    const catchThresh   = Math.max(5,  gkPower * 0.55 - speedPenalty);
    const deflectThresh = Math.max(10, gkPower * 0.80 - speedPenalty);

    if (roll < catchThresh) {
      this._giveOwnership(gk);
      gk.kickTimer = 0;
      this._log(`🧤 ${gk.name} 완전 선방! 공을 잡습니다.`);
    } else if (roll < deflectThresh) {
      const deflectAngle = Math.random() * Math.PI * 2;
      this.ball.velocity = Vector2D.fromAngle(deflectAngle).scale(speed * 0.5);
      this.ball.isShot   = false;
      this._log(`🧤 ${gk.name} 선방! 볼을 걷어냈습니다.`);
    }
    // else: miss — 볼 계속 진행
  }

  _giveOwnership(player) {
    const prev     = this.ball.owner;
    const prevTeam = prev?.team ?? null;
    if (prev) { prev.hasBall = false; }
    this.ball.owner       = player;
    player.hasBall        = true;
    player.kickTimer      = 0;
    this.ball.lastTouched = player;
    this.ball.lastTeam    = player.team;
    this.ball.velocity    = Vector2D.zero();
    this.ball.isShot      = false;

    // ── 턴오버(Turnover) 감지 ─────────────────────────────────────────────
    // 이전 소유 팀이 있고 새 소유자가 다른 팀이면 공수 전환 발생
    if (prevTeam && prevTeam !== player.team) {
      const newTeam = player.team;
      const lostTeam = prevTeam;
      const turnoverPos = this.ball.position.clone();

      // 양 팀 모두 transitionTimer 갱신 + Role Assignment Layer 즉시 재평가 예약
      // (긴급 상황: 소유권 변경 시 ROLE_DECISION_INTERVAL을 기다리지 않고 다음 틱에 바로 재배정)
      for (const team of [this.homeTeam, this.awayTeam]) {
        const isNewOwner = team === newTeam;
        team.tactics.prevWeHaveBall = !isNewOwner; // 전환 직전 상태
        team.tactics.transitionTimer = TR_DURATION;
        team.tactics.transitionT     = 0.0;        // LERP 시작
        team.aiContext.lastRoleUpdate = -Infinity;
      }

      // 공격 전환팀(역습): 공격수·윙어는 COUNTER, 나머지는 일반 반응
      const counterRoles = ['ST', 'LM', 'RM'];
      // 수비 전환팀(방금 빼앗긴 팀): 볼 가까운 2명은 GEGENPRESS, 나머지는 RECOVER
      const lostPlayers  = [...lostTeam.players].filter(p => p.role !== 'GK');
      lostPlayers.sort((a, b) =>
        a.position.sub(turnoverPos).length() - b.position.sub(turnoverPos).length()
      );
      const gegenSet = new Set(lostPlayers.slice(0, TR_GEGENPRESS_N).map(p => p.id));

      for (const team of [this.homeTeam, this.awayTeam]) {
        for (const p of team.players) {
          if (p.role === 'GK') { p.reactionDelay = 0; p.transitionRole = null; continue; }

          // 능력치(vision + positioning 평균)가 높을수록 빠른 반응
          const awareness = (p.attrs.vision + p.attrs.positioning) / 200; // 0~1
          p.reactionDelay = TR_REACT_MIN + (1 - awareness) * (TR_REACT_MAX - TR_REACT_MIN);

          if (team === newTeam) {
            p.transitionRole = counterRoles.includes(p.role) ? 'COUNTER' : null;
          } else {
            p.transitionRole = gegenSet.has(p.id) ? 'GEGENPRESS' : 'RECOVER';
          }
        }
      }

      const typeName = newTeam === this.homeTeam ? this.homeTeam.name : this.awayTeam.name;
      this._log(`⚡ 공수 전환! ${typeName} 볼 탈취 — 역습 전개`);
    }
  }

  // ── 충돌 해소 ───────────────────────────────────────────────

  /**
   * 선수 간 원형 충돌 감지 및 해소 (모든 쌍 O(n²), n=22).
   *
   * 처리 단계:
   *   ① 두 선수 중심 간 거리 계산
   *   ② 거리 < PLAYER_RADIUS * 2 이면 충돌
   *   ③ 위치 보정: 겹친 깊이의 절반씩 서로 반대 방향으로 밀어낸다
   *   ④ 속도 교환: 법선 방향 상대속도의 일부를 교환해 몸싸움 효과를 낸다
   *      (PLAYER_COL_RESTITUTION = 0 → 위치 보정만, 1 → 완전 탄성)
   */
  _resolvePlayerCollisions() {
    const players = this._allPlayers();
    const diameter = PLAYER_RADIUS * 2; // 충돌 최소 거리

    for (let i = 0; i < players.length - 1; i++) {
      for (let j = i + 1; j < players.length; j++) {
        const a = players[i];
        const b = players[j];

        const dx   = b.position.x - a.position.x;
        const dy   = b.position.y - a.position.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist >= diameter || dist < 0.001) continue; // 충돌 없음 또는 완전 겹침

        // ① 법선 방향 단위 벡터 (a → b)
        const nx = dx / dist;
        const ny = dy / dist;

        // ② 위치 보정: strength 비율에 따라 약한 선수 쪽이 더 많이 밀린다
        const sa   = a.attrs?.strength ?? 50;
        const sb   = b.attrs?.strength ?? 50;
        const sSum = sa + sb;
        const totalOverlap = diameter - dist;
        a.position.x -= nx * totalOverlap * (sb / sSum);
        a.position.y -= ny * totalOverlap * (sb / sSum);
        b.position.x += nx * totalOverlap * (sa / sSum);
        b.position.y += ny * totalOverlap * (sa / sSum);

        // ③ 속도 교환: 법선 방향 상대속도 성분을 strength 비율로 교환
        const dVx = a.velocity.x - b.velocity.x;
        const dVy = a.velocity.y - b.velocity.y;
        const dVn = dVx * nx + dVy * ny; // 양수이면 서로 가까워지는 중

        if (dVn > 0) {
          // 강한 선수가 약한 선수를 더 많이 밀어낸다
          const impulseA = dVn * PLAYER_COL_RESTITUTION * (sb / sSum) * 2;
          const impulseB = dVn * PLAYER_COL_RESTITUTION * (sa / sSum) * 2;
          a.velocity.x -= impulseA * nx;
          a.velocity.y -= impulseA * ny;
          b.velocity.x += impulseB * nx;
          b.velocity.y += impulseB * ny;
        }
      }
    }
  }

  /**
   * 공과 선수 몸통 간 충돌 해소.
   * 소유자 없는 공이 선수 몸통(PLAYER_RADIUS + BALL_RADIUS) 이내로 들어오면
   * 탄성 반사하며, 선수의 속도 벡터도 일부 공에 전달된다.
   *
   * ※ _updateOwnership 과의 관계:
   *   - 본 메서드는 물리적 충돌만 처리 (공을 튕겨냄)
   *   - 소유권 획득은 이후 _updateOwnership 에서 별도 판정
   *   - 즉, 공이 너무 빠르면 튕겨나가고, 느리면 잡을 수 있음 (자연스러운 트래핑)
   */
  _resolveBallPlayerCollisions() {
    const ball = this.ball;
    if (ball.owner) return;
    // 공이 선수 키보다 높이 떠 있으면 몸통 충돌 없음
    if (ball.height >= PLAYER_HEIGHT) return;

    const minDist = PLAYER_RADIUS + BALL_RADIUS;

    for (const player of this._allPlayers()) {
      // kickLockTimer 중인 kicker: 공과 물리 충돌도 잠시 비활성화
      if (ball.kickLockTimer > 0 && player === ball.kicker) continue;

      const dx   = ball.position.x - player.position.x;
      const dy   = ball.position.y - player.position.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist >= minDist || dist < 0.001) continue;

      // ① 법선 단위 벡터 (선수 → 공)
      const nx = dx / dist;
      const ny = dy / dist;

      // ② 위치 보정: 겹친 만큼 공을 밀어낸다 (선수 위치는 고정)
      const overlap = minDist - dist;
      ball.position.x += nx * overlap;
      ball.position.y += ny * overlap;

      // ③ 상대속도 법선 성분 계산
      //    공의 속도 - 선수의 속도 → 선수 기준 상대속도
      const relVx = ball.velocity.x - player.velocity.x;
      const relVy = ball.velocity.y - player.velocity.y;
      const relVn = relVx * nx + relVy * ny; // 법선 방향 상대속도

      // 공이 이미 선수에서 멀어지는 방향이면 충격량 적용 불필요
      if (relVn >= 0) continue;

      // ④ 반사 충격량: 상대속도 법선 성분을 역전시키고 에너지 감쇠 적용
      //    impulse = -(1 + e) * relVn  (e = BALL_BODY_RESTITUTION)
      const impulse = -(1 + BALL_BODY_RESTITUTION) * relVn;
      ball.velocity.x += impulse * nx;
      ball.velocity.y += impulse * ny;

      // ⑤ 선수 속도 전달: 달려오는 선수에게 맞으면 공이 더 강하게 튕김
      //    선수의 현재 속도 벡터 중 법선 방향 성분을 BALL_BODY_DRAG 비율로 더한다
      const pVn = player.velocity.x * nx + player.velocity.y * ny;
      ball.velocity.x += pVn * nx * BALL_BODY_DRAG;
      ball.velocity.y += pVn * ny * BALL_BODY_DRAG;

      // 최고 속도 클램핑
      const spd = ball.speed();
      if (spd > BALL_MAX_SPEED) {
        ball.velocity = ball.velocity.normalize().scale(BALL_MAX_SPEED);
      }
    }
  }

  // ── 재시작 처리 ─────────────────────────────────────────────
  _startRestart(type, team, spot, context = null) {
    if (this.phase !== 'IN_PLAY') return;
    this.phase='RESTART_PAUSE';
    this.restart={type,team,spot:spot.clone(),timer:RESTART_PAUSE_TIME,context};
    this.ball.owner=null; this.ball.velocity=Vector2D.zero(); this.ball.height=0; this.ball.verticalVelocity=0;
    for(const p of this._allPlayers()) { p.hasBall=false; p.velocity=Vector2D.zero(); p.desiredVelocity=Vector2D.zero(); p.state='IDLE'; p.actionDecision=null; p.roleTarget=null; }
    this._positionForRestart(type,team,spot,context);
    this.ball.position=spot.clone();
  }

  _positionForRestart(type, team, spot, context) {
    const opp=team===this.homeTeam?this.awayTeam:this.homeTeam;
    team.applyFormationPositions(); opp.applyFormationPositions();
    for(const p of this._allPlayers()) p.reset(p.basePosition);
    const dir=team.attackingDir;
    const clamp=(x,y)=>new Vector2D(Math.max(2,Math.min(PITCH_LEN-2,x)),Math.max(2,Math.min(PITCH_WID-2,y)));
    const takers=team.outfieldPlayers ?? team.players.filter(p=>p.role!=='GK');
    const taker=takers.reduce((best,p)=>!best||p.position.sub(spot).length()<best.position.sub(spot).length()?p:best,null);
    if (!taker) return;
    if (type==='THROW_IN') {
      taker.reset(clamp(spot.x,spot.y));
      const near=takers.filter(p=>p!==taker).sort((a,b)=>a.position.sub(spot).length()-b.position.sub(spot).length());
      if(near[0]) near[0].reset(clamp(spot.x+dir*4, spot.y===0?6:PITCH_WID-6));
      if(near[1]) near[1].reset(clamp(spot.x+dir*9, spot.y===0?12:PITCH_WID-12));
    } else if (type==='CORNER_KICK') {
      taker.reset(clamp(spot.x,spot.y));
      const boxX=spot.x< CX?PEN_BOX_L-2:PITCH_LEN-PEN_BOX_L+2;
      const ys=[CY-7,CY,CY+7]; let i=0;
      for(const p of takers.filter(p=>p!==taker&&['ST','LM','RM','CM'].includes(p.role)).slice(0,3)) p.reset(clamp(boxX,ys[i++]));
    } else if (type==='GOAL_KICK') {
      const gk=team.goalkeeper; const gx=dir===1?GOAL_BOX_L:PITCH_LEN-GOAL_BOX_L;
      const gy=CY; const gkTaker=gk??taker; gkTaker.reset(clamp(gx,gy));
      const cbs=takers.filter(p=>p.role==='CB'); if(cbs[0]) cbs[0].reset(clamp(gx+dir*8,CY-10)); if(cbs[1]) cbs[1].reset(clamp(gx+dir*8,CY+10));
    } else if (type==='OFFSIDE_FREE_KICK') {
      taker.reset(clamp(spot.x,spot.y));
      const near=takers.filter(p=>p!==taker).sort((a,b)=>a.position.sub(spot).length()-b.position.sub(spot).length());
      if(near[0]) near[0].reset(clamp(spot.x+dir*6,spot.y-6)); if(near[1]) near[1].reset(clamp(spot.x+dir*8,spot.y+7));
    }
    this.restart.taker=taker;
  }

  _resumeRestart() {
    const r=this.restart; const taker=r.taker;
    this.phase='IN_PLAY'; this.restart={type:null,team:null,spot:null,timer:0,context:null};
    if(!taker) return;
    if(r.type==='GOAL_KICK') { this._giveOwnership(taker); return; }
    if(r.type==='THROW_IN') {
      const target=taker.team.players.filter(p=>p!==taker&&p.role!=='GK').sort((a,b)=>a.position.sub(taker.position).length()-b.position.sub(taker.position).length())[0];
      if(target){ this._executeKick(taker,target.position,false); return; }
    }
    this._giveOwnership(taker);
  }

  // ── 경계 처리 ────────────────────────────────────────────────

  /**
   * 경기장 경계 반사 + 골포스트 충돌.
   *
   * TODO: 세트피스 구현 시 아래 분기를 교체한다:
   *   X 경계 → isGoal() ? _handleGoal() : _handleGoalLineOut() (코너킥/골킥)
   *   Y 경계 → _handleThrowIn()
   */
  _checkBoundaries() {
    if (this.phase !== 'IN_PLAY') return;

    const ball = this.ball;
    const { x, y } = ball.position;
    const lastTeam = ball.lastTouched?.team ?? ball.kicker?.team ?? ball.passTeam ?? null;

    // 골라인: 골이 아니면 마지막 터치에 따라 코너킥 또는 골킥을 판정한다.
    if (x <= 0 || x >= PITCH_LEN) {
      if (this._isGoal(x, y)) {
        this._handleGoal(x);
        return;
      }

      const defendingAtLine = x <= 0
        ? (this.homeTeam.attackingDir === 1 ? this.homeTeam : this.awayTeam)
        : (this.homeTeam.attackingDir === 1 ? this.awayTeam : this.homeTeam);
      const attackingAtLine = defendingAtLine === this.homeTeam ? this.awayTeam : this.homeTeam;
      const exitY = y <= CY ? 0 : PITCH_WID;

      if (lastTeam === defendingAtLine) {
        // 코너킥은 반드시 실제 코너 지점에 공을 놓는다.
        this._startRestart(
          'CORNER_KICK',
          attackingAtLine,
          new Vector2D(x <= 0 ? 0 : PITCH_LEN, exitY)
        );
      } else {
        // 골킥은 수비팀 골에 가까운 골에어리어 안쪽 중앙에서 재개한다.
        this._startRestart(
          'GOAL_KICK',
          defendingAtLine,
          new Vector2D(x <= 0 ? GOAL_BOX_L : PITCH_LEN - GOAL_BOX_L, CY)
        );
      }
      return;
    }

    // 터치라인: 마지막 터치의 상대팀에게 스로인을 준다.
    if (y < 0 || y > PITCH_WID) {
      const restartTeam = lastTeam === this.homeTeam ? this.awayTeam : this.homeTeam;
      this._startRestart(
        'THROW_IN',
        restartTeam,
        new Vector2D(Math.max(2, Math.min(PITCH_LEN - 2, x)), y < 0 ? 0 : PITCH_WID)
      );
      return;
    }

    this._checkGoalPostCollisions();
  }

  /**
   * 공과 4개 골포스트(기둥) 간의 원형 충돌 탄성 반사.
   *
   * 골포스트 좌표 (각 골대의 상단/하단 기둥):
   *   왼쪽 골대: x=0,          y = CY ± GOAL_W/2
   *   오른쪽 골대: x=PITCH_LEN, y = CY ± GOAL_W/2
   *
   * 공이 포스트 반경(BALL_RADIUS) 이내로 들어오면 포스트에서 멀어지는 방향으로 반사한다.
   * 반사 강도: BALL_BOUNCE (수평 경계 반사와 동일한 에너지 보존율 사용).
   */
  _checkGoalPostCollisions() {
    const ball = this.ball;
    if (ball.height >= PLAYER_HEIGHT) return; // 공중볼은 포스트와 충돌하지 않음

    const halfGoal = GOAL_W / 2;
    // 4개 포스트 좌표 목록
    const posts = [
      { x: 0,         y: CY - halfGoal }, // 왼쪽 상단 포스트
      { x: 0,         y: CY + halfGoal }, // 왼쪽 하단 포스트
      { x: PITCH_LEN, y: CY - halfGoal }, // 오른쪽 상단 포스트
      { x: PITCH_LEN, y: CY + halfGoal }, // 오른쪽 하단 포스트
    ];

    const minDist = BALL_RADIUS + 0.06; // 포스트 반경(약 6cm)을 더해 충돌 범위 설정

    for (const post of posts) {
      const dx   = ball.position.x - post.x;
      const dy   = ball.position.y - post.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < minDist && dist > 0) {
        // 포스트 → 공 방향의 단위 법선 벡터
        const nx = dx / dist;
        const ny = dy / dist;

        // 위치 보정: 겹친 만큼 밀어낸다
        const overlap = minDist - dist;
        ball.position.x += nx * overlap;
        ball.position.y += ny * overlap;

        // 속도 반사: 법선 방향 성분만 반전, 에너지 감쇠 적용
        //   v_reflected = v - 2 * (v · n) * n  (탄성 반사 공식)
        const vDotN = ball.velocity.x * nx + ball.velocity.y * ny;
        ball.velocity.x = (ball.velocity.x - 2 * vDotN * nx) * BALL_BOUNCE;
        ball.velocity.y = (ball.velocity.y - 2 * vDotN * ny) * BALL_BOUNCE;
      }
    }
  }

  // ── 골 처리 ─────────────────────────────────────────────────

  _isGoal(x, y) {
    const [topY, botY] = this._goalYRange();
    return (x <= 0 || x >= PITCH_LEN) && y >= topY && y <= botY;
  }

  _handleGoal(x) {
    const leftTeam  = this.homeTeam.attackingDir === 1 ? this.homeTeam : this.awayTeam;
    const rightTeam = this.homeTeam.attackingDir === 1 ? this.awayTeam : this.homeTeam;
    // 왼쪽 골라인(x≤0) → 오른쪽 공격팀(=rightTeam 아님, leftTeam이 왼쪽 공격한 경우)
    const scoringTeam = x <= 0 ? rightTeam : leftTeam;

    scoringTeam.score++;
    this.ball.reset();
    this.ball.owner = null;
    for (const p of this._allPlayers()) p.hasBall = false;

    const h = this.homeTeam.score, a = this.awayTeam.score;
    this._log(`⚽ 골! ${scoringTeam.name} 득점! (${h} : ${a})`);
    this._updateScoreboard();

    // 실점 팀이 킥오프
    this._pendingKickoffTeam = scoringTeam === this.homeTeam ? this.awayTeam : this.homeTeam;
    this.goalPause = 2.5;
    this.phase     = 'GOAL_PAUSE';
  }

  // ── 하프타임 ────────────────────────────────────────────────

  _handleHalfTime() {
    this._log('하프타임! 팀이 진영을 바꿉니다.');
    this.homeTeam.flipDirection();
    this.awayTeam.flipDirection();
    this._setupKickoff(this.awayTeam);
  }

  // ── draw ────────────────────────────────────────────────────

  draw() {
    this.renderer.clear();
    this.renderer.drawPitch();
    this.renderer.drawPlayers(this._allPlayers());
    this.renderer.drawBall(this.ball);
    if (this.debugAI) this.renderer.drawDebugOverlay(this._allPlayers());
  }

  // ── 헬퍼 ────────────────────────────────────────────────────

  _allPlayers() {
    return [...this.homeTeam.players, ...this.awayTeam.players];
  }

  /** team 선수 중 pos에 가장 가까운 선수를 반환한다 */
  _nearestTo(team, pos, excludeGK = false) {
    const pool = excludeGK ? team.outfieldPlayers : team.players;
    let best = null, bestD = Infinity;
    for (const p of pool) {
      const d = p.position.sub(pos).length();
      if (d < bestD) { bestD = d; best = p; }
    }
    return best;
  }

  /**
   * 선수가 볼을 가로챌 수 있는 예상 지점을 계산한다.
   * 볼 경로 위에서 선수가 도달 가능한 가장 빠른 지점을 선택한다.
   * 정지 볼이면 볼 위치 그대로 반환한다.
   *
   * TODO: 공중볼 낙하지점(포물선) 역산 로직으로 교체 예정
   */
  _interceptPoint(player, ball) {
    const spd = ball.speed();
    if (spd < 0.5) return ball.position.clone();

    const dir   = ball.velocity.normalize();
    const stopT = spd / BALL_FRICTION;

    for (let t = 0.1; t <= Math.min(stopT, 5.0); t += 0.1) {
      const traveled  = Math.max(0, spd * t - 0.5 * BALL_FRICTION * t * t);
      const futurePos = ball.position.add(dir.scale(traveled));
      if (player.position.sub(futurePos).length() <= player.maxSpeed * t * 1.05) {
        return futurePos;
      }
    }
    // 볼 최종 정지 지점
    return ball.position.add(dir.scale((spd * spd) / (2 * BALL_FRICTION)));
  }

  _goalYRange() {
    return [CY - GOAL_W / 2, CY + GOAL_W / 2];
  }

  // ── UI 헬퍼 ─────────────────────────────────────────────────

  formatTime() {
    const tot = Math.floor(this.matchTime);
    const m   = Math.floor(tot / 60);
    const s   = tot % 60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  _updateScoreboard() {
    document.getElementById('scoreHome').textContent = this.homeTeam.score;
    document.getElementById('scoreAway').textContent = this.awayTeam.score;
  }

  _updatePossessionBar() {
    const total = this.homeTeam.possessionTicks + this.awayTeam.possessionTicks;
    if (total === 0) return;
    const hp  = Math.round(this.homeTeam.possessionTicks / total * 100);
    const ap  = 100 - hp;
    const hEl = document.getElementById('possHome');
    const aEl = document.getElementById('possAway');
    if (hEl) { hEl.style.width = hp + '%'; hEl.textContent = hp + '%'; }
    if (aEl) { aEl.style.width = ap + '%'; aEl.textContent = ap + '%'; }
  }

  _log(msg) {
    if (!this._logEl) return;
    const el = document.createElement('div');
    el.textContent = `[${this.formatTime()}] ${msg}`;
    this._logEl.prepend(el);
    while (this._logEl.children.length > 60) this._logEl.lastChild.remove();
  }
}

// ================================================================
//  SECTION 9: GameLoop
//  requestAnimationFrame 기반 60fps 루프.
//  timeScale로 배속을 제어한다.
//  update()와 draw()를 명확히 분리해 물리와 렌더링을 독립적으로 테스트할 수 있다.
// ================================================================
class GameLoop {
  constructor({ update, draw }) {
    this._update   = update;
    this._draw     = draw;
    this.running   = false;
    this.timeScale = 2;
    this._lastTs   = null;
    this._rafId    = null;
    this._loop     = this._loop.bind(this);
    this.onTick    = null;   // 클락 갱신 콜백
  }

  start() {
    if (this.running) return;
    this.running = true;
    this._lastTs = null;
    this._rafId  = requestAnimationFrame(this._loop);
  }

  stop() {
    this.running = false;
    if (this._rafId) { cancelAnimationFrame(this._rafId); this._rafId = null; }
  }

  setTimeScale(ts) { this.timeScale = ts; }

  _loop(ts) {
    if (!this.running) return;
    if (this._lastTs === null) this._lastTs = ts;

    // dt 캡: 탭 비활성 복귀 시 200ms 이상의 dt를 방지
    const rawDt = Math.min((ts - this._lastTs) / 1000, 0.2);
    this._lastTs = ts;

    this._update(rawDt * this.timeScale);
    this._draw();
    if (this.onTick) this.onTick();

    this._rafId = requestAnimationFrame(this._loop);
  }
}


// ================================================================
//  SECTION 10: 진입점 (Entry Point)
//  DOM 준비 후 캔버스·Match·GameLoop를 연결하고 경기를 시작한다.
// ================================================================
window.addEventListener('DOMContentLoaded', () => {
  const canvas     = document.getElementById('field');
  canvas.width     = CW;
  canvas.height    = CH;

  const match      = new Match(canvas);

  const gameLoop   = new GameLoop({
    update: (dt) => match.update(dt),
    draw:   ()   => match.draw(),
  });

  // 클락·점유율·매치 정보 UI 갱신 콜백
  const clockEl = document.getElementById('clock');
  const phaseEl = document.getElementById('phaseLabel');
  const infoEl  = document.getElementById('matchInfo');
  const PHASE_LABELS = {
    KICKOFF:    '킥오프',
    IN_PLAY:    '경기 진행 중',
    GOAL_PAUSE: '⚽ 골!',
    FULL_TIME:  '경기 종료',
  };

  gameLoop.onTick = () => {
    if (clockEl) clockEl.textContent = match.formatTime();
    if (phaseEl) phaseEl.textContent = PHASE_LABELS[match.phase] ?? match.phase;
    match._updatePossessionBar();

    // 매치 인포 패널 갱신 (0.5초마다로 제한하면 성능 개선 가능)
    if (infoEl) {
      const total = match.homeTeam.possessionTicks + match.awayTeam.possessionTicks;
      const hp    = total ? Math.round(match.homeTeam.possessionTicks / total * 100) : 50;
      infoEl.innerHTML =
        `홈 점유율: <b>${hp}%</b><br>` +
        `어웨이 점유율: <b>${100 - hp}%</b><br>` +
        `경기 시간: <b>${match.formatTime()}</b>`;
    }
  };

  gameLoop.start();

  // ── UI 컨트롤 ──
  const btnPlay  = document.getElementById('btnPlay');
  const btnReset = document.getElementById('btnReset');
  const speedSel = document.getElementById('speedSelect');

  btnPlay.addEventListener('click', () => {
    if (gameLoop.running) {
      gameLoop.stop();
      btnPlay.textContent = '▶ 재생';
    } else {
      gameLoop.start();
      btnPlay.textContent = '일시정지';
    }
  });

  btnReset.addEventListener('click', () => {
    match.reset();
    match.draw();
  });

  speedSel.addEventListener('change', () => {
    gameLoop.setTimeScale(Number(speedSel.value));
  });
  gameLoop.setTimeScale(Number(speedSel.value));

  const chkDebugAI = document.getElementById('chkDebugAI');
  chkDebugAI.addEventListener('change', () => {
    match.debugAI = chkDebugAI.checked;
  });

  // 디버그용 전역 접근 (브라우저 콘솔에서 window.__match, window.__loop로 확인)
  window.__match = match;
  window.__loop  = gameLoop;
});
</script>
