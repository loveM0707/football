<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Football Match Engine – Skeleton v1.0</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; font-family: Arial, sans-serif; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

    /* ── 스코어보드 ── */
    #scoreboard {
      width: 100%; max-width: 1060px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 20px; background: #111827;
      border-bottom: 2px solid #374151;
    }
    .team-block { display: flex; align-items: center; gap: 14px; }
    .team-name  { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
    .team-score { font-size: 28px; font-weight: 900; }
    .home .team-score { color: #60a5fa; }
    .away .team-score { color: #f87171; }
    #centerInfo { text-align: center; }
    #clock      { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
    #phaseLabel { font-size: 11px; color: #9ca3af; margin-top: 2px; }

    /* ── 툴바 ── */
    #toolbar {
      width: 100%; max-width: 1060px;
      display: flex; align-items: center; gap: 12px;
      padding: 8px 20px; background: #1f2937; border-bottom: 1px solid #374151;
    }
    #toolbar button {
      padding: 5px 14px; border: 1px solid #4b5563; border-radius: 5px;
      background: #374151; color: #fff; cursor: pointer; font-size: 13px;
    }
    #toolbar button:hover { background: #4b5563; }
    #toolbar label { font-size: 13px; color: #d1d5db; }
    #toolbar select {
      margin-left: 6px; padding: 3px 8px; border-radius: 4px;
      background: #374151; color: #fff; border: 1px solid #4b5563;
    }

    /* ── 메인 레이아웃 ── */
    #layout {
      display: flex; gap: 16px;
      padding: 14px 20px; width: 100%; max-width: 1240px;
    }
    #pitchWrap { flex: 0 0 auto; }
    #field     { display: block; }

    /* 점유율 바 */
    #possessionBar {
      display: flex; height: 20px; margin-top: 6px;
      border-radius: 3px; overflow: hidden; font-size: 11px; font-weight: 700;
    }
    .poss-fill {
      display: flex; align-items: center; justify-content: center;
      transition: width 0.5s ease;
    }
    .poss-fill.home { background: #1d4ed8; }
    .poss-fill.away { background: #b91c1c; }

    /* ── 사이드 패널 ── */
    #sidePanel { flex: 1; min-width: 220px; max-width: 280px; }
    .panel-block {
      background: #1f2937; border-radius: 8px; padding: 14px;
      margin-bottom: 12px; border: 1px solid #374151;
    }
    .panel-block h3 { font-size: 13px; color: #9ca3af; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.6px; }
    #eventLog { max-height: 360px; overflow-y: auto; font-size: 12px; color: #d1d5db; }
    #eventLog div { padding: 4px 0; border-bottom: 1px solid #374151; }
    #eventLog div:first-child { color: #fbbf24; }
  </style>
</head>
<body>

<header id="scoreboard">
  <div class="team-block home">
    <span class="team-name" id="teamNameHome">서울 유나이티드</span>
    <span class="team-score home" id="scoreHome">0</span>
  </div>
  <div id="centerInfo">
    <div id="clock">00:00</div>
    <div id="phaseLabel">킥오프 준비</div>
  </div>
  <div class="team-block away">
    <span class="team-score away" id="scoreAway">0</span>
    <span class="team-name" id="teamNameAway">부산 아틀레틱</span>
  </div>
</header>

<div id="toolbar">
  <button id="btnPlay">일시정지</button>
  <button id="btnReset">리셋</button>
  <label>배속
    <select id="speedSelect">
      <option value="1">1×</option>
      <option value="2" selected>2×</option>
      <option value="4">4×</option>
      <option value="8">8×</option>
    </select>
  </label>
  <label><input type="checkbox" id="chkDebugAI"> AI 디버그(역할)</label>
</div>

<div id="layout">
  <div id="pitchWrap">
    <canvas id="field"></canvas>
    <div id="possessionBar">
      <div id="possHome" class="poss-fill home" style="width:50%">50%</div>
      <div id="possAway" class="poss-fill away" style="width:50%">50%</div>
    </div>
  </div>
  <aside id="sidePanel">
    <div class="panel-block">
      <h3>경기 정보</h3>
      <div id="matchInfo" style="font-size:12px;color:#9ca3af;line-height:1.8"></div>
    </div>
    <div class="panel-block">
      <h3>이벤트 로그</h3>
      <div id="eventLog"></div>
    </div>
  </aside>
</div>

<script>
'use strict';

// ================================================================
//  SECTION 1: 상수 & 설정
//  경기장 규격, 물리, AI 튜닝 파라미터를 한곳에 모아둔다.
//  추후 튜닝이 필요하면 이 섹션만 수정한다.
// ================================================================

// ── 경기장 (단위: 미터, FIFA 표준) ──
const PITCH_LEN  = 105;
const PITCH_WID  = 68;
const SCALE      = 10;         // 1m = 10px
const GOAL_W     = 7.32;       // 골대 폭
const GOAL_DEPTH = 2;          // 골대 깊이 (시각 표현)
const PEN_BOX_L  = 16.5;       // 페널티 박스 세로 길이
const PEN_BOX_W  = 40.32;      // 페널티 박스 가로 너비
const GOAL_BOX_L = 5.5;
const GOAL_BOX_W = 18.32;
const PEN_SPOT   = 11;
const CENTER_R   = 9.15;       // 센터서클 반경
const CORNER_R   = 1;

// 파생 상수
const CW = PITCH_LEN * SCALE;  // 캔버스 폭 (px)
const CH = PITCH_WID * SCALE;  // 캔버스 높이 (px)
const CX = PITCH_LEN / 2;      // 피치 중앙 X (m)
const CY = PITCH_WID / 2;      // 피치 중앙 Y (m)

// ── 볼 물리 ──
const BALL_RADIUS    = 0.38;   // m (실제보다 시각적으로 살짝 크게)
const BALL_FRICTION  = 7.5;    // 지면 감속도 (m/s²) — 잔디 마찰
const BALL_MAX_SPEED = 28;     // 최고 속도 상한 (m/s ≈ 100 km/h)
const BALL_BOUNCE    = 0.55;   // 경계(터치라인/골라인) 수평 반사 에너지 보존율
const BALL_BOUNCE_Z  = 0.35;   // 지면 수직 바운스 에너지 보존율 (Z축) — 낮을수록 덜 튕김
const BALL_MIN_VZ    = 1.2;    // 이 속도 이하면 Z바운스 중단하고 완전 착지 처리
const BALL_CTRL_R    = 1.5;    // 선수가 볼을 제어 가능한 반경 (m)
const KICK_LOCK_T    = 0.45;   // 킥 직후 재소유 불가 시간 (s)
const GRAVITY        = 9.8;    // 중력 가속도 (m/s²)
const PLAYER_HEIGHT  = 1.8;    // 선수 키 (m) — 이 높이 이상이면 공중볼로 소유 불가
const LOFT_DIST      = 20;     // 이 거리(m) 이상 킥은 로빙(lofted) 패스로 처리 (20m → 단거리는 땅볼)
const SHOOT_DIST     = 25;     // 이 거리(m) 이내 + 마땅한 패스 대상 없으면 슈팅

// ── 충돌 물리 ──
const PLAYER_RADIUS        = 0.50;  // 선수 충돌 반경 (m)
const PLAYER_COL_RESTITUTION = 0.25; // 선수-선수 충돌 시 속도 교환 비율 (0=위치만, 1=완전탄성)
const BALL_BODY_RESTITUTION  = 0.55; // 공-선수 몸통 충돌 탄성 계수
const BALL_BODY_DRAG         = 0.30; // 선수 속도가 공에 전달되는 비율

// ── 선수 AI ──
const P_MAX_SPEED = 5.8;       // 일반 선수 최고 속도 (m/s)
const GK_MAX_SPD       = 5.0;   // 골키퍼 최고 속도
const GK_HOLD_DELAY    = 3.5;   // GK 볼 소유 후 배급까지 최소 대기 시간 (s)
const GK_SAVE_RADIUS   = 3.2;   // 슈팅 선방 판정 반경 (일반 제어 반경보다 넓음, m)
const GK_STEP_MIN      = 0.9;   // 각도 좁히기 최소 전진 깊이 — 골라인에서 이 거리 유지 (m)
const GK_STEP_MAX      = 5.8;   // 각도 좁히기 최대 전진 깊이 (m, 페널티 스�� 근처)
const GK_SWEEPER_DIST  = 26;    // 스위퍼 키퍼 발동 거리: 골문에서 이 범위 내 루즈볼 (m)
const P_ACCEL     = 9.0;       // 가속도 (m/s²)
const KICK_DELAY  = 0.30;      // 공 소유 후 ���까지 준비 시간 (s)
const KICK_V_MIN  = 10;        // ��� 최소 초속 (m/s) — 상향 조정: 슈팅/패스 파워 강화
const KICK_V_MAX  = 30;        // ��� 최대 초속 (m/s) — 상향 조정: 파워 슈팅 지원
const KICK_SPREAD = Math.PI / 24;  // ��� 각도 오차 (±라디안)
const TETHER_R    = 20;
// ── 실제 플레이 의사결정 / 재시작 ──
const ACTION_DECISION_INTERVAL = 0.18;  // 의사결정 주기 단축: 0.22→0.18로 더 빠른 반응
const DRIBBLE_MIN_COMMIT = 0.85;
const DRIBBLE_MAX_COMMIT = 1.80;
const HOLD_MIN_COMMIT = 0.45;
const ROLE_SWITCH_MARGIN = 8;
const JOCKEY_DISTANCE = 2.2;
const MAX_MARK_DEVIATION_FROM_ZONE = 11;
const RESTART_PAUSE_TIME = 2.0;
const PASS_BASE_SPREAD = Math.PI / 90;
const SHOT_BASE_SPREAD = Math.PI / 30;
        // 기본 위치 이탈 허용 최대�� (m)

// ── Formation Manager 상수 (Tactical Compactness) ──
const FM_DEF_NORM_ATT_MIN = 0.28; // 공격 시 수비 라인 최소 높이 (자기골 기준 비율)
const FM_DEF_NORM_ATT_MAX = 0.55; // 공격 시 수비 라인 최대 높이 (볼이 전진할수록 높아짐)
const FM_DEF_NORM_DEF_MIN = 0.20; // 수비 시 수비 라인 최소 높이 (자기 박스 앞)
const FM_DEF_NORM_DEF_MAX = 0.40; // 수비 시 수비 라인 최대 높이 (하프라인 직전)
const FM_LINE_GAP_ATT     = 18;   // 공격 시 라인 간격 축소: 컴��트한 빌드업 지원 (기존 20 → 18)
const FM_LINE_GAP_DEF     = 13;   // 수비 시 라인 간격 축소: 블록 더 압축 (기존 15 → 13)
const FM_HORIZ_SHIFT_ATT  = 3;    // 공격 시 가로 시프트 감소: 측면 폭 유지 (기존 4 → 3)
const FM_HORIZ_SHIFT_DEF  = 6;    // 수비 시 가로 시프트 감소: 과도한 중앙 ��림 방지 (기존 7 → 6)

// ── Offside Trap 상수 ──────────────────────────────────────────────────────
const OT_DEF_NORM_MIN       = 0.43; // 오프사이드 트랩 발동 시 수비 라인 최소 높이 비율
const OT_MIN_POSITIONING    = 72;   // 수비수 평균 positioning 이 이 값 이상이면 자동 발동
const OT_BALL_PROGRESS_MAX  = 0.62; // 볼 전진도가 이 값 미만일 때만 트랩 유지 (너무 깊으면 해제)

// ── 전방 압박 (Pressing Trigger) 상수 ─────────────────────────────────────
const PR_PRESS_N         = 1;    // 동시 압박 최대 선수 수 (1번: 직진, 2·3번: 측면 에워싸기)
const PR_CHASE_RADIUS    = 18;   // 이 거리 이내 수비수만 압박자 후보로 선정 (m) - 축소: 22→18
const PR_FLANK_ANGLE     = 0.4;  // 2·3번 압박자의 측면 오프�� 각도 (라디안, ≈23°)
const PR_DEF_NORM_BOOST  = 0.35; // 압박 시 defLineNorm 목표 = min(0.50, 0.35 + bp*이��) - 축소: 0.40→0.35
const PR_DEF_NORM_MAX    = 0.48; // 압박 시 수비 라인 상한 - 축소: 0.50→0.48

// ── 공수 전환 (Transition) 상수 ────────────────────────────────────────────
const TR_DURATION        = 1.5;  // [버그 수정] 전환 완충 전체 시간 (초) — 4.0→1.5로 단축하여 수비수 동상 현상 방지
const TR_REACT_MIN       = 0.2;  // 최소 반응 딜레이 (초, 능력치 최상 선수)
const TR_REACT_MAX       = 1.5;  // 최대 반응 딜레이 (초, 능력치 최하 선수)
const TR_GEGENPRESS_N    = 2;    // 수비 전환 시 즉각 압박(게겐프레싱) 선수 수
const TR_COUNTER_RUN_W   = 2.8;  // 역습 전환 시 공격수 침투 힘 배율 (OTB_RUN_W 대비)
const TR_RETURN_MARK_W   = 1.2;  // 수비 복귀 중 마크 대상 방향 추가 힘 가중치
const MARKING_RADIUS  = 7;     // 이 거리 이내 적 공격수 → MARKING 상태 진입 (m)
const TACKLE_RADIUS   = 5;     // 이 거리 이내 볼 소유 적 → TACKLING 상태 진입 (m)
const TACKLE_EXEC_R   = 1.4;   // 이 거리 이하에서 태클 성공 확률 계산 실행 (m)
const TACKLE_BASE_P   = 0.40;  // 태클 기본 성공 확률 (0~1)
const PASS_BLOCK_DIST = 2.0;   // 패스 경로 차단 판정 거리 (m) — 수비수가 이 거리 내에 있으면 경로 차단으로 판정
const OPEN_SPACE_R    = 4.0;   // 오픈 스페이스 판정 반경 (m) — 이 반경 내 수비수 없으면 오픈 포지션

// ── Role Assignment Layer 상수 ──────────────────────────────────────────
// TEAM DECISION → ROLE ASSIGNMENT → FSM 3계층 구조에서 "누가 무엇을 담당하는가"를 결정.
// FSM State("어떻게 실행하는가")와는 독립된 개념이다.
const ROLE_DECISION_INTERVAL = 0.35; // 팀 단위 역할(WHO) 재평가 주기 (s) — 사실상의 최소 유지 시간 역할도 겸함
const ROLE_MIN_HOLD_TIME     = 0.5;  // 개별 역할 최소 유지 시간 목표치 (s, 디버그/향후 확장용 기록)
const RD_LINE_BREAK_PENALTY  = 2.2;  // PRIMARY_PRESSER 선정 시 자기 라인에서 전진해야 하는 거리당 감점
const RD_COVER_OFFSET        = 4.5;  // SECONDARY_COVER가 프레서보다 골문 쪽으로 물러서는 기준 거리 (m)
const RD_BLOCK_LEAD          = 0.55; // PASS_BLOCKER 위치: 볼홀더-위험상대 선분 위 보간 비율(0=홀더측,1=상대측)
const SUPPORT_MIN_DIST       = 6;    // 패스 지원 후보 위치의 볼 소유자 기준 반경 하한 (m)
const SUPPORT_MAX_DIST       = 24;   // 패스 지원 후보 탐색 반경 상한 (m)
const TEAMMATE_MIN_SPACING   = 7;    // 지원 위치 스코어링: 동료와 이보다 가까우면 감점 (m)
const WIDTH_Y_MARGIN         = 6;    // WIDTH_HOLDER가 터치라인에서 유지하는 최소 여유 (m)

// ── 오프더볼 조향 힘 (Off-the-ball Steering Forces) ──
// 공격 상황 RUNNING 선수에게 합산 적용되는 7개 파라미터.
// 숫자가 클수록 해당 힘의 영향력이 커진다. 각 힘은 단위��터 × 가중치로 계산된다.
const OTB_BASE_W  = 2.5;  // 기본 포지션 유지 힘 대폭 강화: 존(Zone) 유지 및 진형 붕괴 방지 (기존 1.0 → 2.5)
const OTB_EVADE_W = 0.8;  // 수비수 회피 힘 가중치 (공간 창출)
const OTB_EVADE_R = 5.0;  // 수비수 회피 감지 반경 (m) — 이 거리 내 적을 밀어낸다
const OTB_SEP_W   = 1.2;  // 동료 간격 유지 힘 대폭 강화: ����침 방지 (기존 0.5 → 1.2)
const OTB_SEP_R   = 4.5;  // 동료 간격 유지 반경 확대: 더 넓은 개인 공간 확보 (기존 3.0 → 4.5)
const OTB_LANE_W  = 0.9;  // 패스 길 열어주기 힘 가중치 (새 패스 각도 창출)
const OTB_RUN_W   = 0.7;  // 침투 움직임 힘 가중치 (공격수 전용 전진 돌파)

// ── 경기 ──
const MATCH_DUR   = 90 * 60;   // 90분 (초)

// ── 능력치 스케일링 상수 (Attribute Scaling) ──
// 1~100 능력치 값을 시뮬레이션 단위로 변환하는 기준선. 이 범위만 조정하면 전체 밸런스가 바뀐다.
const ATTR_PACE_MIN   = 3.8;   // pace=1   → 최소 속력 (m/s)
const ATTR_PACE_MAX   = 6.8;   // pace=100 → 최대 속력 (m/s)
const ATTR_VISION_MIN = 14;    // vision=1   → 패스 탐색 최소 반경 (m)
const ATTR_VISION_MAX = 38;    // vision=100 → 패스 탐색 최대 반경 (m)
const ATTR_CTRL_MIN   = 0.8;   // control=1   → 볼 제어 최소 반경 (m)
const ATTR_CTRL_MAX   = 2.0;   // control=100 → 볼 제어 최대 반경 (m)
const ATTR_TACKLE_MIN = 0.15;  // tackling=1   → 태클 최소 성공 확률
const ATTR_TACKLE_MAX = 0.70;  // tackling=100 → 태클 최대 성공 확률
const STAMINA_DRAIN   = 0.015; // 최고 속도 주행 시 스태미나 소모율 (포인트/초)
const STAMINA_SPD_MIN = 0.75;  // 스태미나 완전 고갈 시 속도 하한 배율 (기본 속도의 75%)

// ── 포지션별 선수 능력치 템플릿 (1~100 스케일) ──
// 각 선수 생성 시 ±10 무작위 변동이 더해져 같은 포지션이라도 개성이 생긴다.
//   pace       — 기본 이동 속력 (pace→maxSpeed 변환은 ATTR_PACE_* 참고)
//   stamina    — 90분 체력 (고갈 시 maxSpeed가 STAMINA_SPD_MIN까지 감소)
//   strength   — 몸싸움 질량 (충돌 시 밀리는 비율 결정, 클수록 덜 밀림)
//   passing    — 패스 방향 오차 및 초속 정확도
//   shooting   — 슈팅 파워·방향 오차
//   control    — 볼 제어 반경 (ATTR_CTRL_* 범위, 클수록 먼 공도 잡음)
//   tackling   — 태클 성공 확률 (ATTR_TACKLE_* 범위)
//   vision     — 패스 탐색 반경 (ATTR_VISION_* 범위)
//   positioning— 오프더볼 포지션 정확도 (향후 진형감각 AI에 활용)
const PLAYER_ATTRIBUTES_TEMPLATE = {
  GK: { pace:55, stamina:70, strength:72, passing:55, shooting:30, control:62, tackling:50, vision:68, positioning:85 },
  LB: { pace:73, stamina:80, strength:68, passing:66, shooting:44, control:63, tackling:74, vision:62, positioning:72 },
  CB: { pace:60, stamina:76, strength:83, passing:60, shooting:35, control:57, tackling:82, vision:58, positioning:80 },
  RB: { pace:73, stamina:80, strength:68, passing:66, shooting:44, control:63, tackling:74, vision:62, positioning:72 },
  LM: { pace:80, stamina:83, strength:62, passing:72, shooting:65, control:73, tackling:56, vision:72, positioning:68 },
  CM: { pace:68, stamina:86, strength:70, passing:78, shooting:62, control:73, tackling:68, vision:78, positioning:75 },
  RM: { pace:80, stamina:83, strength:62, passing:72, shooting:65, control:73, tackling:56, vision:72, positioning:68 },
  ST: { pace:83, stamina:78, strength:75, passing:65, shooting:85, control:72, tackling:45, vision:72, positioning:82 },
};


// ================================================================
//  SECTION 2: Vector2D
//  2D 좌표·벡터 연산. 모든 위치·속도에 사용한다.
//  메서드는 항상 새 인스턴스를 반환한다(불변/immutable).
// ================================================================
class Vector2D {
  constructor(x = 0, y = 0) { this.x = x; this.y = y; }

  add(v)    { return new Vector2D(this.x + v.x, this.y + v.y); }
  sub(v)    { return new Vector2D(this.x - v.x, this.y - v.y); }
  scale(s)  { return new Vector2D(this.x * s,   this.y * s);   }
  dot(v)    { return this.x * v.x + this.y * v.y; }
  clone()   { return new Vector2D(this.x, this.y); }

  length()   { return Math.sqrt(this.x * this.x + this.y * this.y); }
  lengthSq() { return this.x * this.x + this.y * this.y; }

  normalize() {
    const l = this.length();
    return l > 1e-9 ? this.scale(1 / l) : new Vector2D();
  }

  /** 라디안 각도와 길이로 벡터를 생성한다 */
  static fromAngle(angle, len = 1) {
    return new Vector2D(Math.cos(angle) * len, Math.sin(angle) * len);
  }

  /** 벡터의 방향각 (라디안) */
  angle() { return Math.atan2(this.y, this.x); }

  static zero() { return new Vector2D(0, 0); }
}


// ================================================================
//  SECTION 3: Ball
//  공 엔티티. 물리 상태(위치·속도·소유권)만 보관한다.
//  물리 적분은 Match._updateBallPhysics()에서 수행한다.
//
//  TODO 확장 진입점:
//    - height / verticalVelocity 추가 → 포물선 롱패스·크로스·헤더
//    - passTargetPlayer 추가 → 패스 수신 선수 판정
// ================================================================
class Ball {
  constructor() {
    this.radius = BALL_RADIUS;
    this.position = new Vector2D(CX, CY);
    this.velocity = Vector2D.zero();

    // 소유권 상태
    this.owner        = null;   // Player | null — 현재 소유자
    this.lastTouched  = null;   // 마지막으로 터치한 Player
    this.lastTeam     = null;   // 마지막으로 터치한 Team
    this.kickLockTimer = 0;     // > 0 이면 kicker는 즉시 재소유 불가
    this.kicker       = null;   // 직전에 찬 선수 (kickLockTimer 동안 재소유 차단)
    this.isShot       = false;  // 슈팅 여부 (GK 선방 판정 분리 목적)

    // Pseudo-3D Z축 — 공의 높이와 수직 속도
    this.height          = 0;   // 현재 지면으로부터 높이 (m, 0 = 지면)
    this.verticalVelocity = 0;  // Z축 속도 (m/s, 양수=상승, 음수=하강)

    // 오프사이드 판정 데이터 (패스 순간 스냅샷)
    this.offsideLineX   = null; // 패스 순간 2번째로 앞선 수비수 X 좌표
    this.offsidePlayers = [];   // 오프사이드 위치에 있던 공격 선수 id 배열
    this.passTeam       = null; // 패스한 팀 (수신자가 이 팀 소속이면 오프사이드 체크)
  }

  /**
   * 지상 킥. groundVelocity(Vector2D)로 공을 찬다.
   * kicker 는 kickLockTimer 동안 공을 다시 잡을 수 없다.
   */
  kick(groundVelocity, kicker = null, isShot = false) {
    this.velocity         = groundVelocity.clone();
    this.owner            = null;
    this.kicker           = kicker;
    this.kickLockTimer    = KICK_LOCK_T;
    this.isShot           = isShot;
    // 지상 킥은 Z축 초기화
    this.height           = 0;
    this.verticalVelocity = 0;
  }

  /**
   * 로빙 킥 (lofted pass / cross).
   * groundVelocity: 수평 벡터, vz: 초기 수직 속도(m/s, 위로 올라가는 힘).
   * 공이 포물선 궤적을 그리며 날아가다 착지한다.
   */
  loftKick(groundVelocity, vz, kicker = null, isShot = false) {
    this.velocity         = groundVelocity.clone();
    this.owner            = null;
    this.kicker           = kicker;
    this.kickLockTimer    = KICK_LOCK_T;
    this.isShot           = isShot;
    this.height           = 0.3;  // 발 차는 순간 살짝 들려 있는 상태
    this.verticalVelocity = vz;   // 위로 올라가는 초기 속도 (m/s)
  }

  /** 킥오프·골 후 공을 리셋한다 */
  reset(pos) {
    this.position         = (pos ?? new Vector2D(CX, CY)).clone();
    this.velocity         = Vector2D.zero();
    this.owner            = null;
    this.kicker           = null;
    this.kickLockTimer    = 0;
    this.isShot           = false;
    this.height           = 0;
    this.verticalVelocity = 0;
    this.offsideLineX     = null;
    this.offsidePlayers   = [];
    this.passTeam         = null;
  }

  speed() { return this.velocity.length(); }
}


// ================================================================
//  SECTION 4: Player
//  개별 선수 엔티티.
//
//  State (상태 머신):
//    POSITIONING  — 기본 위치(basePosition)로 복귀 이동
//    CHASING      — 볼을 향해 전속력 압박 (팀 내 최근접 선수)
//    HAS_BALL     — 공 소유, 상대 골대 방향 드리블
//    GK_GUARD     — 골키퍼 전용: 골대-볼 사이 포지셔닝
//
//  TODO 세트피스 상태 확장 진입점:
//    THROW_IN_TAKER | CORNER_TAKER | FREE_KICK_TAKER | GOAL_KICK_TAKER
//    MARKING | SET_PIECE_WAIT
// ================================================================
class Player {
  constructor({ name, number, role, color, team = null, attrs = null }) {
    this.id     = Player._nextId++;
    this.name   = name;
    this.number = number;
    this.role   = role;   // 'GK'|'LB'|'CB'|'RB'|'LM'|'CM'|'RM'|'ST'
    this.color  = color;
    this.team   = team;

    this.position         = Vector2D.zero();
    this.velocity         = Vector2D.zero();
    this.desiredVelocity  = Vector2D.zero();
    this.basePosition     = Vector2D.zero();  // 포메이션 기본 위치 (정규화 슬롯 → 실제 좌표)
    this.tacticalPosition = Vector2D.zero();  // Formation Manager가 매 틱 갱신하는 목표 위치
    this.facingAngle      = 0;                // 바라보는 방향 (라디안)

    this.state     = 'POSITIONING';
    this.kickTimer = 0;   // 공 소유 후 킥까지 카운트업 (s)
    this.hasBall   = false;

    // 공수 전환 — 개별 반응 딜레이
    this.reactionDelay  = 0;  // > 0 이면 아직 전환 상황을 '인식'하지 못한 상태 (s)
    this.transitionRole = null; // 'GEGENPRESS' | 'COUNTER' | 'RECOVER' | null

    // ── Role Assignment Layer — "무엇을 담당하는가" (FSM State와 독립) ──
    this.roleAssignment   = null; // PRIMARY_PRESSER|SECONDARY_COVER|PASS_BLOCKER|MARKER|HOLD_LINE|REST_DEFENDER|
                                   // BALL_HOLDER|PASS_SUPPORT|FORWARD_RUNNER|WIDTH_HOLDER|BACK_SUPPORT|null
    this.roleTarget       = null; // Vector2D|null — Role Layer가 산출한 이동 목표(_stateRunning의 anchor로 사용)
    this.roleAssignedAt   = 0;    // 역할이 마지막으로 (재)배정된 matchTime
    this.roleMinHoldUntil = 0;    // 디버그/향후 확장용 — 역할이 배정된 후 최소 유지되어야 할 시각
    this._markAssignee    = null; // 이 선수가 담당하는 상대 선수(Player) — 팀 단위 마킹 중복 방지용
    // ── 공 소유 행동 의사결정 ──
    this.actionDecision    = null; // DRIBBLE|PASS|SHOOT|HOLD
    this.actionStartedAt   = 0;
    this.actionCommitUntil = 0;
    this.lastActionEvalAt  = -Infinity;
    this.dribbleStartPosition = null;
    this.dribbleDistance   = 0;
    this._passPlan         = null;

    // 능력치 초기화
    const template = PLAYER_ATTRIBUTES_TEMPLATE[role] ?? PLAYER_ATTRIBUTES_TEMPLATE.CM;
    this.attrs = attrs ?? { ...template };

    // pace → baseMaxSpeed 선형 매핑
    const paceSpd = ATTR_PACE_MIN + (this.attrs.pace / 100) * (ATTR_PACE_MAX - ATTR_PACE_MIN);
    this.baseMaxSpeed = role === 'GK' ? Math.min(paceSpd, GK_MAX_SPD) : paceSpd;
    this.maxSpeed     = this.baseMaxSpeed;

    // 스태미나: 속성값을 현재 스태미나의 기준으로 사용
    this.currentStamina = this.attrs.stamina;
  }

  /** 이동 후 매 틱 호출. 스태미나 감소 및 maxSpeed 재산출. */
  updateStamina(currentSpeed, dt) {
    if (currentSpeed > 0.1) {
      const drainRate = (currentSpeed / this.baseMaxSpeed) * STAMINA_DRAIN;
      this.currentStamina = Math.max(0, this.currentStamina - drainRate * dt);
    }
    const ratio   = this.attrs.stamina > 0 ? this.currentStamina / this.attrs.stamina : 0;
    this.maxSpeed = this.baseMaxSpeed * (STAMINA_SPD_MIN + ratio * (1 - STAMINA_SPD_MIN));
  }

  /** 포메이션 재배치 시 호출. pos: 새 기본 위치 Vector2D */
  reset(pos) {
    this.position        = pos.clone();
    this.velocity        = Vector2D.zero();
    this.desiredVelocity = Vector2D.zero();
    this.state           = 'POSITIONING';
    this.kickTimer       = 0;
    this.hasBall         = false;
    this.facingAngle      = this.team?.attackingDir === 1 ? 0 : Math.PI;
    this.tacticalPosition = this.basePosition.clone(); // 리셋 시 포메이션 위치로 초기화
    this.reactionDelay    = 0;
    this.transitionRole   = null;
    this.roleAssignment   = null;
    this.roleTarget       = null;
    this.roleAssignedAt   = 0;
    this.roleMinHoldUntil = 0;
    this._markAssignee    = null;
    this.actionDecision    = null;
    this.actionStartedAt   = 0;
    this.actionCommitUntil = 0;
    this.lastActionEvalAt  = -Infinity;
    this.dribbleStartPosition = null;
    this.dribbleDistance   = 0;
    this._passPlan         = null;
    // currentStamina는 리셋하지 않음 — 경기 전반에 걸쳐 누적 소모
  }
}
Player._nextId = 1;


// ================================================================
//  SECTION 5: Formations
//  포메이션 정규화 좌표 (nx: 자기골→상대골 0~1, ny: 위→아래 0~1).
//  getFormationPositions()가 attackingDir에 따라 실제 m 좌표로 변환한다.
//
//  TODO 추가 포메이션 진입점:
//    '4-3-3': [...],
//    '3-5-2': [...],
//    '4-2-3-1': [...],
// ================================================================
const FORMATIONS = {
  '4-4-2': [
    { role: 'GK', nx: 0.048, ny: 0.50 },
    { role: 'LB', nx: 0.190, ny: 0.14 },
    { role: 'CB', nx: 0.195, ny: 0.36 },
    { role: 'CB', nx: 0.195, ny: 0.64 },
    { role: 'RB', nx: 0.190, ny: 0.86 },
    { role: 'LM', nx: 0.430, ny: 0.14 },
    { role: 'CM', nx: 0.430, ny: 0.37 },
    { role: 'CM', nx: 0.430, ny: 0.63 },
    { role: 'RM', nx: 0.430, ny: 0.86 },
    { role: 'ST', nx: 0.635, ny: 0.39 },
    { role: 'ST', nx: 0.635, ny: 0.61 },
  ],
};

/**
 * 정규화 슬롯을 실제 피치 좌표(m)로 변환한다.
 * attackingDir === 1 (오른쪽 공격): x = nx × PITCH_LEN
 * attackingDir === -1(왼쪽 공격): x = (1 − nx) × PITCH_LEN (좌우 반전)
 */
function getFormationPositions(formationName, attackingDir) {
  const slots = FORMATIONS[formationName] ?? FORMATIONS['4-4-2'];
  return slots.map(({ role, nx, ny }) => ({
    role,
    x: attackingDir === 1 ? nx * PITCH_LEN : (1 - nx) * PITCH_LEN,
    y: ny * PITCH_WID,
  }));
}


// ================================================================
//  SECTION 6: Team
//  팀 엔티티. 선수 목록·전술·점수를 관리한다.
//  포메이션 위치 재계산과 공격 방향 전환이 여기서 이루어진다.
// ================================================================
class Team {
  constructor({ name, side, color, formation = '4-4-2' }) {
    this.name      = name;
    this.side      = side;          // 'home' | 'away'
    this.color     = color;
    this.formation = formation;
    this.players   = [];            // Player[] (buildRoster()로 채운다)

    // 홈 = 오른쪽(+x) 공격, 어웨이 = 왼쪽(-x) 공격
    this.attackingDir = side === 'home' ? 1 : -1;

    this.score           = 0;
    this.possessionTicks = 0;       // 볼 소유 프레임 수

    // ── 전술 상태 (Formation Manager가 읽고 쓰는 슬롯) ──────────────────
    this.tactics = {
      // [Offside Trap]: 수비수 평균 positioning 기반 자동 발동.
      offsideTrap: false,

      // [Transition Shape]: 공수 전환 완충 — LERP으로 진형을 서서히 이동
      transitionTimer:   0,     // 남은 전환 시간 (s, TR_DURATION에서 카운트다운)
      prevWeHaveBall:    false, // 전환 직전의 공수 상태 (LERP 시작점)
      transitionT:       1.0,   // LERP 비율 (0=이전 진형, 1=새 진형); 1.0이면 완료

      // [Pressing Trigger]: 볼이 설정 구역을 넘으면 팀 블록을 전진시켜 에워싼다.
      pressing:          true,  // 압박 전술 활성화 여부
      pressingThreshold: 0.50,  // 발동 볼 전진도 임계값 (0~1, 0.5 = 하프라인)

      // TODO [Defensive Line Height]: 수동 라인 높이 고정 오버라이드.
      //   defensiveLineHeight: null,
    };

    // ── TEAM DECISION LAYER — 팀 전체 상황 판단 (Role Assignment Layer가 참조) ──
    this.aiContext = {
      phase:       'OUT_OF_POSSESSION', // IN_POSSESSION|OUT_OF_POSSESSION|TRANSITION_TO_ATTACK|TRANSITION_TO_DEFENCE
      ballZone:    'OWN_MIDDLE_THIRD',  // OWN_DEFENSIVE_THIRD|OWN_MIDDLE_THIRD|OPPONENT_MIDDLE_THIRD|OPPONENT_DEFENSIVE_THIRD
      ballSide:    'CENTER',            // LEFT|CENTER|RIGHT
      dangerLevel: 0,                   // 0~1, 수비 상황에서만 의미 있음
      primaryPresser: null,
      secondaryCover: null,
      passBlockers:   [],
      markers:        [],               // [{ defender, opponent }]
      lastRoleUpdate: -Infinity,        // 마지막으로 역할(WHO)을 재배정한 matchTime
    };
  }

  get goalkeeper()     { return this.players.find(p => p.role === 'GK'); }
  get outfieldPlayers(){ return this.players.filter(p => p.role !== 'GK'); }

  /** 하프타임: 공격 방향을 반전하고 포메이션 좌표를 재계산한다 */
  flipDirection() {
    this.attackingDir *= -1;
    this.applyFormationPositions();
  }

  /**
   * 현재 attackingDir 기준으로 각 선수의 basePosition·role을 갱신한다.
   * 경기 시작, 하프타임, 리셋마다 호출해야 한다.
   */
  applyFormationPositions() {
    const slots = getFormationPositions(this.formation, this.attackingDir);
    this.players.forEach((player, i) => {
      const slot = slots[i] ?? slots[slots.length - 1];
      player.role         = slot.role;
      player.basePosition = new Vector2D(slot.x, slot.y);
      player.facingAngle  = this.attackingDir === 1 ? 0 : Math.PI;
    });
  }

  /**
   * Formation Manager — 매 틱 호출.
   * 공수 상황과 볼 위치를 바탕으로 각 선수의 tacticalPosition(목표 위치)을 산출한다.
   *
   * ┌─ Vertical Compactness ──────────────────────────────────────────────┐
   * │ 수비 라인 높이(defLineNorm)를 볼 전진도에 따라 동적으로 결정한다.       │
   * │ 수비→미드→공격 순으로 FM_LINE_GAP_ATT/DEF 간격으로 배치하여           │
   * │ 팀 블록 전체 깊이가 35~50m 이내로 유지된다.                           │
   * └─────────────────────────────────────────────────────────────────────┘
   * ┌─ Horizontal Compactness (Ball-side Overload) ───────────────────────┐
   * │ 볼이 측면에 있을 때 전 선수가 볼 방향(Y)으로 시프트하여               │
   * │ 볼 주위 수비/공격 밀도를 높인다. 공격 시 폭 유지, 수비 시 더 강하게.   │
   * └─────────────────────────────────────────────────────────────────────┘
   *
   * @param {Ball} ball           - 현재 볼 객체
   * @param {Team|null} possTeam  - 볼 소유 팀 (null = 루즈볼)
   */
  updateTacticalPositions(ball, possTeam, dt = 0) {
    const weHaveBall  = possTeam === this;
    const dir         = this.attackingDir;       // +1(오른쪽 공격) | -1(왼쪽 공격)
    const ownGoalX    = dir === 1 ? 0 : PITCH_LEN;

    // ── Transition LERP 타이머 갱신 ──────────────────────────────────────
    if (this.tactics.transitionTimer > 0) {
      this.tactics.transitionTimer = Math.max(0, this.tactics.transitionTimer - dt);
      // transitionT: 0(이전 진형)→1(새 진형)로 선형 증가
      this.tactics.transitionT = 1.0 - this.tactics.transitionTimer / TR_DURATION;
    } else {
      this.tactics.transitionT = 1.0;
    }

    // 볼 전진도: 0 = 자기 골문 방향, 1 = 상대 골문 방향
    const ballProgress = dir === 1
      ? ball.position.x / PITCH_LEN
      : 1 - ball.position.x / PITCH_LEN;

    // ── ① Vertical: 수비 라인 높이 결정 ─────────────────────────────────
    //
    // [Offside Trap 자동 평가]: 수비수 평균 positioning ≥ OT_MIN_POSITIONING 이고
    //   볼이 아직 상대 진영 깊숙이 침투하지 않은 경우(ballProgress < OT_BALL_PROGRESS_MAX)
    //   오프사이드 트랩을 발동해 수비 라인 하한을 OT_DEF_NORM_MIN 으로 높인다.
    {
      const defenders = this.players.filter(p => ['CB', 'LB', 'RB'].includes(p.role));
      const avgPos = defenders.length
        ? defenders.reduce((s, p) => s + p.attrs.positioning, 0) / defenders.length
        : 0;
      this.tactics.offsideTrap = avgPos >= OT_MIN_POSITIONING && ballProgress < OT_BALL_PROGRESS_MAX;
    }
    //
    // TODO [Defensive Line Height 오버라이드]:
    //   if (this.tactics.defensiveLineHeight !== null) {
    //     defLineNorm = this.tactics.defensiveLineHeight; return; }

    // ── 압박 트리거 활성 여부 평가 ────────────────────────────────────────
    // 수비 상황 + pressing 설정 켜짐 + 볼이 pressingThreshold 이상 전진했을 때 발동.
    // 단, 상대 GK가 볼을 소유 중이면 압박을 발동하지 않는다:
    //   → GK 배급 대기 중에 라인이 과도하게 올라가면 뒷공간이 열리기 때문.
    // [버그 수정] GK 면역 조건: GK가 자기 페널티 박스 안에 있을 때만 압박 억제
    // 박스 밖으로 나온 GK는 일반 선수처럼 취급하여 라인 붕괴(모세 효과) 방지
    const oppGKOwner = ball.owner?.role === 'GK' && ball.owner.team !== null && !weHaveBall ? ball.owner : null;
    let ballOwnerIsOppGK = false;
    if (oppGKOwner) {
      const gp = oppGKOwner.position;
      const halfW = PEN_BOX_W / 2;
      const inY = gp.y >= CY - halfW && gp.y <= CY + halfW;
      const inX = oppGKOwner.team.attackingDir === 1 ? gp.x <= PEN_BOX_L : gp.x >= PITCH_LEN - PEN_BOX_L;
      ballOwnerIsOppGK = inY && inX;
    }
    const pressingActive = !weHaveBall
      && !ballOwnerIsOppGK
      && this.tactics.pressing
      && ballProgress >= this.tactics.pressingThreshold;
    this.tactics.pressingActive = pressingActive; // _updateAI에서 다중 압박자 선정에 사용

    // ── defLineNorm 산출 — 현재 상태 기준 목표값 ─────────────────────────
    const _calcDefNorm = (haveBall, bProgress) => {
      // 압박 발동 중 수비 상태면 라인을 볼 방향으로 강하게 끌어올린다
      if (!haveBall && pressingActive) {
        return Math.min(PR_DEF_NORM_MAX, 0.35 + bProgress * PR_DEF_NORM_BOOST);
      }
      const normMin = !haveBall && this.tactics.offsideTrap
        ? OT_DEF_NORM_MIN
        : (haveBall ? FM_DEF_NORM_ATT_MIN : FM_DEF_NORM_DEF_MIN);
      return haveBall
        ? Math.max(normMin, Math.min(FM_DEF_NORM_ATT_MAX, 0.30 + bProgress * 0.32))
        : Math.max(normMin, Math.min(FM_DEF_NORM_DEF_MAX, 0.22 + bProgress * 0.22));
    };

    // LERP: 전환 중이면 이전 진형 → 새 진형 사이를 부드럽게 보간
    const t = this.tactics.transitionT;  // 0=이전, 1=새
    const defNormTarget = _calcDefNorm(weHaveBall, ballProgress);
    const defNormPrev   = _calcDefNorm(this.tactics.prevWeHaveBall, ballProgress);
    const defLineNorm   = defNormPrev + (defNormTarget - defNormPrev) * t;

    // 라인 간격: 공격 시 넓게, 수비 시 좁게 → 블록 깊이 조절 (LERP 적용)
    const lineGapTarget = weHaveBall ? FM_LINE_GAP_ATT : FM_LINE_GAP_DEF;
    const lineGapPrev   = this.tactics.prevWeHaveBall ? FM_LINE_GAP_ATT : FM_LINE_GAP_DEF;
    const lineGap       = lineGapPrev + (lineGapTarget - lineGapPrev) * t;

    // 라인별 X 좌표 (dir 부호에 따라 자동으로 좌/우 방향 적용)
    const defLineX = ownGoalX + dir * defLineNorm * PITCH_LEN;
    const midLineX = defLineX + dir * lineGap;
    const attLineX = midLineX + dir * lineGap;

    // ── ② Horizontal: 볼 방향 가로 시프트 (Ball-side Overload) ──────────
    // 볼이 Y축 중앙(CY)에서 얼마나 벗어났는지에 비례해 모든 선수를 시프트.
    // 수비 시 더 강하게 이동해 볼 주변 밀도를 높인다.
    //
    // LERP: 가로 시프트 세기도 전환 중에 서서히 변화
    const ballYOffset      = ball.position.y - CY;
    const horizShiftTarget = weHaveBall ? FM_HORIZ_SHIFT_ATT : FM_HORIZ_SHIFT_DEF;
    const horizShiftPrev   = this.tactics.prevWeHaveBall ? FM_HORIZ_SHIFT_ATT : FM_HORIZ_SHIFT_DEF;
    const horizShiftMax    = horizShiftPrev + (horizShiftTarget - horizShiftPrev) * t;
    const horizShift       = ballYOffset * (horizShiftMax / CY);

    // ── ③ 선수별 tacticalPosition 계산 ──────────────────────────────────
    for (const player of this.players) {
      if (player.role === 'GK') {
        // GK는 GK_GUARD 상태가 독자적으로 위치 관리 — 명목값만 설정
        player.tacticalPosition = new Vector2D(ownGoalX + dir * 5, CY);
        continue;
      }

      // 역할에 따라 해당 라인 X 배정
      let lineX;
      switch (player.role) {
        case 'CB': case 'LB': case 'RB': lineX = defLineX; break;
        case 'LM': case 'CM': case 'RM': lineX = midLineX; break;
        case 'ST':                         lineX = attLineX; break;
        default:                           lineX = midLineX; // 미지 역할은 미드필드
      }

      // 가로 시프트 감도: 공격 시 와이드 선수는 폭을 유지, 수비 시 모두 집결
      const isWide    = ['LB', 'RB', 'LM', 'RM'].includes(player.role);
      const shiftMult = weHaveBall
        ? (isWide ? 0.30 : 0.60)   // 공격: 와이드는 폭 유지, 중앙은 밀집
        : (isWide ? 0.50 : 0.85);  // 수비: 모두 강하게 볼 방향으로 집결
      const ty = Math.max(2, Math.min(PITCH_WID - 2,
        player.basePosition.y + horizShift * shiftMult));

      // X 클램핑: 피치 안으로 제한 (골라인에서 2m 여유)
      const tx = Math.max(2, Math.min(PITCH_LEN - 2, lineX));

      player.tacticalPosition = new Vector2D(tx, ty);
    }
  }

  /**
   * Team Decision Layer — 팀 전체 상황(공수 페이즈·볼 구역·측면·위험도)을 판단한다.
   * Role Assignment Layer(Match._assignRoles)가 이 값을 읽어 개별 선수 역할을 배정한다.
   * 매 틱 updateTacticalPositions 직후 호출한다.
   */
  updateAIContext(ball, possTeam) {
    const weHaveBall = possTeam === this;
    const dir        = this.attackingDir;

    // ── 페이즈: 기존 turnover LERP(transitionTimer)을 그대로 재사용 ──
    this.aiContext.phase = this.tactics.transitionTimer > 0
      ? (weHaveBall ? 'TRANSITION_TO_ATTACK' : 'TRANSITION_TO_DEFENCE')
      : (weHaveBall ? 'IN_POSSESSION' : 'OUT_OF_POSSESSION');

    // ── 볼 구역: 자기 골문(0) → 상대 골문(1) 기준 3분할 + 상대 박스 세분화 ──
    const ballProgress = dir === 1 ? ball.position.x / PITCH_LEN : 1 - ball.position.x / PITCH_LEN;
    this.aiContext.ballZone =
      ballProgress > 1 - PEN_BOX_L / PITCH_LEN ? 'OPPONENT_DEFENSIVE_THIRD' :
      ballProgress >= 2 / 3 ? 'OPPONENT_MIDDLE_THIRD' :
      ballProgress >= 1 / 3 ? 'OWN_MIDDLE_THIRD' :
      'OWN_DEFENSIVE_THIRD';

    // ── 볼 측면 ──
    const ySpan = PITCH_WID / 3;
    this.aiContext.ballSide = ball.position.y < ySpan ? 'LEFT'
      : ball.position.y > ySpan * 2 ? 'RIGHT' : 'CENTER';

    // ── 위험도(0~1): 수비 상황에서만 산출 — 골문 근접도 + 침투 상대 위험도 ──
    if (!weHaveBall) {
      const ownGoalX = dir === 1 ? 0 : PITCH_LEN;
      const distToOwnGoal    = Math.abs(ball.position.x - ownGoalX);
      const proximityDanger  = Math.max(0, 1 - distToOwnGoal / (PITCH_LEN * 0.5));

      let intruderDanger = 0;
      if (possTeam) {
        for (const opp of possTeam.players) {
          if (opp.role === 'GK') continue;
          const d = Math.abs(opp.position.x - ownGoalX);
          intruderDanger = Math.max(intruderDanger, 1 - Math.min(1, d / (PITCH_LEN * 0.4)));
        }
      }
      this.aiContext.dangerLevel = Math.max(0, Math.min(1, proximityDanger * 0.6 + intruderDanger * 0.4));
    } else {
      this.aiContext.dangerLevel = 0;
    }
  }
}


// ================================================================
//  SECTION 7: Renderer
//  캔버스 드로잉 전담. 로직·상태를 변경하지 않는 순수 뷰(View).
//  모든 피치 좌표(m)는 × SCALE → 픽셀로 변환한다.
// ================================================================
class Renderer {
  constructor(ctx) { this.ctx = ctx; }

  clear() {
    this.ctx.clearRect(0, 0, CW, CH);
  }

  // ── 경기장 ──────────────────────────────────────────────────

  drawPitch() {
    const ctx = this.ctx;

    // 줄무늬 잔디
    ctx.fillStyle = '#256b20';
    ctx.fillRect(0, 0, CW, CH);
    ctx.fillStyle = '#2c7a26';
    const sw = CW / 12;
    for (let i = 0; i < 12; i += 2) ctx.fillRect(i * sw, 0, sw, CH);

    // 흰 선 공통 설정
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.fillStyle   = 'rgba(255,255,255,0.85)';
    ctx.lineWidth   = 2;

    // 터치라인·골라인
    ctx.strokeRect(1, 1, CW - 2, CH - 2);

    // 하프웨이 라인
    ctx.beginPath(); ctx.moveTo(CW / 2, 0); ctx.lineTo(CW / 2, CH); ctx.stroke();

    // 센터서클 + 센터 스팟
    const cr = CENTER_R * SCALE;
    ctx.beginPath(); ctx.arc(CW / 2, CH / 2, cr, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(CW / 2, CH / 2, 3, 0, Math.PI * 2); ctx.fill();

    // 양쪽 끝 박스·골대·아크
    this._drawEnd(ctx, 'left');
    this._drawEnd(ctx, 'right');

    // 코너 아크
    const car = CORNER_R * SCALE;
    [[0,0,0,Math.PI/2],[0,CH,-Math.PI/2,0],[CW,0,Math.PI/2,Math.PI],[CW,CH,Math.PI,3*Math.PI/2]]
      .forEach(([x,y,s,e]) => { ctx.beginPath(); ctx.arc(x,y,car,s,e); ctx.stroke(); });
  }

  _drawEnd(ctx, side) {
    const isL = side === 'left';
    const ex  = isL ? 0 : CW;           // 골라인 X (px)
    const dir = isL ? 1 : -1;           // 필드 안쪽 방향

    // 페널티 박스
    const pbW = PEN_BOX_L * SCALE, pbH = PEN_BOX_W * SCALE;
    const pbY = (PITCH_WID / 2 - PEN_BOX_W / 2) * SCALE;
    ctx.strokeRect(isL ? ex : ex - pbW, pbY, pbW, pbH);

    // 골 에어리어
    const gbW = GOAL_BOX_L * SCALE, gbH = GOAL_BOX_W * SCALE;
    const gbY = (PITCH_WID / 2 - GOAL_BOX_W / 2) * SCALE;
    ctx.strokeRect(isL ? ex : ex - gbW, gbY, gbW, gbH);

    // 페널티 스팟
    const spotX = isL ? PEN_SPOT * SCALE : CW - PEN_SPOT * SCALE;
    ctx.beginPath(); ctx.arc(spotX, CH / 2, 2.5, 0, Math.PI * 2); ctx.fill();

    // 페널티 아크 (박스 바깥쪽만)
    const dLine = PEN_BOX_L - PEN_SPOT;
    const arcAng = Math.acos(Math.min(1, dLine / CENTER_R));
    ctx.beginPath();
    ctx.arc(spotX, CH / 2, CENTER_R * SCALE,
      isL ? -arcAng : Math.PI - arcAng,
      isL ?  arcAng : Math.PI + arcAng);
    ctx.stroke();

    // 골대 (경기장 밖 반투명)
    const gtY = (PITCH_WID / 2 - GOAL_W / 2) * SCALE;
    const gh  = GOAL_W * SCALE;
    const gd  = GOAL_DEPTH * SCALE;
    ctx.strokeStyle = 'rgba(255,255,255,0.40)';
    ctx.strokeRect(isL ? -gd : ex, gtY, gd, gh);
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  }

  // ── 선수 ────────────────────────────────────────────────────

  /**
   * 탑다운 원형 선수를 그린다.
   * 두 발 → 몸통 원 → 등번호 순으로 그린다.
   * 공 소유자에게는 금색 하이라이트 링을 추가한다.
   */
  drawPlayers(players) {
    const ctx = this.ctx;
    for (const p of players) {
      const cx = p.position.x * SCALE;
      const cy = p.position.y * SCALE;
      const r  = 6.5;

      // 공 소유 하이라이트
      if (p.hasBall) {
        ctx.beginPath();
        ctx.arc(cx, cy, r + 3.5, 0, Math.PI * 2);
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth   = 2.2;
        ctx.stroke();
      }

      // 두 발 (바라보는 방향 앞쪽 좌우에 그린다)
      const fx = Math.cos(p.facingAngle), fy = Math.sin(p.facingAngle);
      const px = -fy, py = fx;   // 수직 방향 (perpendicular)
      ctx.fillStyle   = '#14161b';
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth   = 0.6;
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.arc(cx + fx * r * 1.25 + px * r * 0.60 * s,
                cy + fy * r * 1.25 + py * r * 0.60 * s,
                2.4, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      }

      // 몸통 원
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle   = p.color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth   = 1.3;
      ctx.stroke();

      // 등번호
      ctx.fillStyle    = '#fff';
      ctx.font         = 'bold 8px Arial';
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.number, cx, cy);

      // 상태 디버그 색상 링 (CHASING rank0=빨강, rank1·2=주황, HAS_BALL=노랑)
      if (p.state === 'CHASING') {
        ctx.beginPath();
        ctx.arc(cx, cy, r + 5, 0, Math.PI * 2);
        const rank = p._pressRank ?? -1;
        ctx.strokeStyle = rank <= 0 ? 'rgba(255,60,60,0.9)' : 'rgba(255,165,0,0.85)';
        ctx.lineWidth   = rank <= 0 ? 2.2 : 1.6;
        ctx.stroke();
      }
    }
  }

  /**
   * AI 디버그 오버레이 — 각 선수의 FSM State / Role Assignment / roleTarget을 표시한다.
   * Role Assignment Layer 동작 검증용. 성능 영향을 피하기 위해 토글이 켜졌을 때만 호출한다.
   */
  drawDebugOverlay(players) {
    const ctx = this.ctx;
    ctx.font      = '7px Arial';
    ctx.textAlign = 'center';

    for (const p of players) {
      const cx = p.position.x * SCALE, cy = p.position.y * SCALE;

      // roleTarget으로의 연결선
      if (p.roleTarget) {
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(p.roleTarget.x * SCALE, p.roleTarget.y * SCALE);
        ctx.strokeStyle = 'rgba(0,255,180,0.45)';
        ctx.lineWidth   = 1;
        ctx.stroke();
      }

      // FSM State 라벨
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.fillText(p.state, cx, cy - 13);

      // Role Assignment 라벨
      if (p.roleAssignment) {
        ctx.fillStyle = 'rgba(255,215,0,0.95)';
        ctx.fillText(p.roleAssignment, cx, cy - 21);
      }
    }
  }

  // ── 볼 ─────────────────────────────────────────────────────

  drawBall(ball) {
    const ctx   = this.ctx;
    // 그림자는 항상 지면(2D 투영 위치)에 그린다
    const cx    = ball.position.x * SCALE;
    const cy    = ball.position.y * SCALE;
    // 공 본체는 높이(height)만큼 위(Y 마이너스 방향)로 올려 그린다
    //   탑다운 뷰에서 높이 표현: 위로 올라갈수록 화면 위쪽에 그려진다
    const heightPx = ball.height * SCALE * 0.6; // Z→Y 투영 계수 (0.6 = 시각적 원근감)
    const ballCY   = cy - heightPx;             // 본체 Y 좌표 (높이 오프셋 적용)
    const speed    = ball.speed();
    const isAerial = ball.height > 0.1;         // 공중볼 여부

    // 속도 흔적 (빠를수록 진하게 — 지면 구를 때만 표시)
    if (!isAerial && speed > 7) {
      const dir  = ball.velocity.normalize();
      const len  = 5 + speed * 0.35;
      const grad = ctx.createLinearGradient(cx - dir.x * len, cy - dir.y * len, cx, cy);
      grad.addColorStop(0, 'rgba(255,165,0,0)');
      grad.addColorStop(1, 'rgba(255,165,0,0.35)');
      ctx.beginPath();
      ctx.moveTo(cx - dir.x * len, cy - dir.y * len);
      ctx.lineTo(cx, cy);
      ctx.strokeStyle = grad;
      ctx.lineWidth   = ball.radius * SCALE * 1.8;
      ctx.lineCap     = 'round';
      ctx.stroke();
      ctx.lineCap     = 'butt';
    }

    // 그림자: 지면(cx, cy) 위치에 고정. 높이가 높을수록 크고 투명해진다.
    const shadowScale = 1 + ball.height * 0.12;        // 높이에 따라 그림자 확대
    const shadowAlpha = Math.max(0.06, 0.28 - ball.height * 0.025);
    ctx.beginPath();
    ctx.ellipse(cx + 1.5, cy + 1.5,
      (5 + speed * 0.1) * shadowScale, 2.5 * shadowScale,
      0.3, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0,0,0,${shadowAlpha})`;
    ctx.fill();

    // 공중볼 연결선: 지면 그림자와 공 본체를 잇는 점선 (높이 1m 이상일 때)
    if (ball.height > 1) {
      ctx.save();
      ctx.setLineDash([3, 4]);
      ctx.strokeStyle = 'rgba(0,0,0,0.20)';
      ctx.lineWidth   = 0.8;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx, ballCY);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    // 볼 본체: ballCY 위치에 그리고, 높이가 높을수록 반경을 살짝 키운다 (원근감)
    //   높이 10m → 반경 +50% 까지 선형 확대
    const br = ball.radius * SCALE * (1 + Math.min(0.5, ball.height * 0.04));
    ctx.beginPath();
    ctx.arc(cx, ballCY, br, 0, Math.PI * 2);
    ctx.fillStyle   = '#fff';
    ctx.fill();
    ctx.strokeStyle = isAerial ? '#555' : '#222'; // 공중볼은 외곽선을 연하게
    ctx.lineWidth   = 1;
    ctx.stroke();
  }
}


// ================================================================
//  SECTION 8: Match
//  매치 엔진 오케스트레이터.
//
//  update(dt) 실행 순서:
//    ① AI 결정 (각 선수의 desiredVelocity 설정)
//    ② 선수 이동 물리 적분
//    ③ 볼 물리 적분 (소유자 없을 때) 또는 발에 부착 (소유자 있을 때)
//    ④ 소유권 판정 (BALL_CTRL_R 내 선수 → 소유)
//    ⑤ 경계 충돌 처리
//
//  draw()는 Renderer에 위임한다.
//
//  Phase 목록 (현재 구현):
//    'KICKOFF'    — 경기 시작·재개 대기
//    'IN_PLAY'    — 정상 플레이
//    'GOAL_PAUSE' — 골 직후 재시작 대기
//    'FULL_TIME'  — 경기 종료
//
//  TODO 세트피스 Phase 확장 진입점:
//    'SET_PIECE_SETUP' | 'THROW_IN' | 'CORNER_KICK' | 'GOAL_KICK' | 'FREE_KICK'
// ================================================================
class Match {
  constructor(canvas) {
    this.canvas   = canvas;
    this.ctx      = canvas.getContext('2d');
    this.renderer = new Renderer(this.ctx);

    this.ball = new Ball();

    // ── 팀 생성 ──
    this.homeTeam = new Team({ name: '서울 유나이티드', side: 'home', color: '#3b6fd6' });
    this.awayTeam = new Team({ name: '부산 아틀레틱',   side: 'away', color: '#d6483b' });
    this._buildRoster(this.homeTeam);
    this._buildRoster(this.awayTeam);

    // ── 경기 상태 ──
    this.phase       = 'KICKOFF';
    this.matchTime   = 0;           // 경과 시간 (s)
    this.debugAI     = false;       // true면 draw()에서 Role Assignment Layer 디버그 오버레이 표시
    this.halfTime    = MATCH_DUR / 2;
    this.goalPause   = 0;           // 골 후 대기 시간
    this._pendingKickoffTeam = this.awayTeam;
    this.restart = { type: null, team: null, spot: null, timer: 0, context: null };

    this._setupKickoff(this.homeTeam);
    this._logEl  = document.getElementById('eventLog');
    this._infoEl = document.getElementById('matchInfo');
    this._updateScoreboard();
  }

  // ── 선수 생성 ────────────────────────────────────────────────

  _buildRoster(team) {
    const slots = FORMATIONS['4-4-2'];
    team.players = slots.map((slot, i) => {
      const template = PLAYER_ATTRIBUTES_TEMPLATE[slot.role] ?? PLAYER_ATTRIBUTES_TEMPLATE.CM;
      const attrs = {};
      for (const [key, base] of Object.entries(template)) {
        attrs[key] = Math.max(1, Math.min(100, base + Math.round((Math.random() - 0.5) * 20)));
      }
      const p = new Player({
        name  : `${team.name.split(' ')[0]} ${i + 1}`,
        number: i + 1,
        role  : slot.role,
        color : team.color,
        team,
        attrs,
      });
      return p;
    });
    team.applyFormationPositions();
  }

  // ── 셋업 / 리셋 ──────────────────────────────────────────────

  /**
   * 킥오프 준비.
   * 모든 선수를 포메이션 위치로 즉시 이동하고 공을 센터에 놓는다.
   * @param {Team} kickingTeam - 공을 차는 팀
   */
  _setupKickoff(kickingTeam) {
    this.homeTeam.applyFormationPositions();
    this.awayTeam.applyFormationPositions();
    for (const p of this._allPlayers()) p.reset(p.basePosition);

    this.ball.reset(new Vector2D(CX, CY));

    // 킥오프 팀의 아웃필더 중 센터에 가장 가까운 선수가 공을 소유
    const taker = this._nearestTo(kickingTeam, this.ball.position, true);
    if (taker) {
      taker.position = new Vector2D(CX, CY);
      this._giveOwnership(taker);
    }

    this.phase     = 'KICKOFF';
    this.goalPause = 0;
    this._log(`킥오프: ${kickingTeam.name}`);
  }

  reset() {
    this.matchTime = 0;
    this.homeTeam.score = this.awayTeam.score = 0;
    this.homeTeam.possessionTicks = this.awayTeam.possessionTicks = 0;
    if (this.homeTeam.attackingDir !== 1) {
      this.homeTeam.flipDirection();
      this.awayTeam.flipDirection();
    }
    this._setupKickoff(this.homeTeam);
    this._updateScoreboard();
    this._updatePossessionBar();
  }

  // ── 메인 업데이트 루프 ──────────────────────────────────────

  /**
   * 한 프레임 시뮬레이션.
   * 큰 dt(배속·탭 복귀)로 인한 터널링을 막기 위해 서브스텝으로 분할한다.
   * @param {number} dt - 프레임 경과 시간 (초)
   */
  update(dt) {
    const MAX_STEP = 0.05;
    let rem = dt;
    while (rem > 1e-6) {
      const step = Math.min(MAX_STEP, rem);
      this._tick(step);
      rem -= step;
    }
  }

  _tick(dt) {
    if (this.phase === 'FULL_TIME') return;

    // 재시작 대기
    if (this.phase === 'RESTART_PAUSE') {
      this.restart.timer -= dt;
      if (this.restart.timer <= 0) this._resumeRestart();
      return;
    }
    // 골 직후 대기
    if (this.goalPause > 0) {
      this.goalPause -= dt;
      if (this.goalPause <= 0) this._setupKickoff(this._pendingKickoffTeam);
      return;
    }

    // 시간 진행
    this.matchTime += dt;

    // 하프타임
    if (this.phase === 'IN_PLAY' &&
        this.matchTime >= this.halfTime &&
        this.matchTime - dt < this.halfTime) {
      this._handleHalfTime();
      return;
    }

    // 경기 종료
    if (this.matchTime >= MATCH_DUR) {
      this.phase = 'FULL_TIME';
      this._log(`경기 종료! 최종 스코어 ${this.homeTeam.score}:${this.awayTeam.score}`);
      return;
    }

    this.phase = 'IN_PLAY';

    // ① AI — 각 선수의 desiredVelocity를 결정
    this._updateAI(dt);

    // ② 선수 이동
    for (const p of this._allPlayers()) this._movePlayer(p, dt);

    // ③ 선수 간 충돌 해소 (이동 직후에 수행해야 위치 보정이 정확하다)
    this._resolvePlayerCollisions();

    // ④ 볼 물리
    if (this.ball.owner) {
      this._attachBallToFoot(this.ball.owner);
      this.ball.owner.team.possessionTicks++;
    } else {
      this._updateBallPhysics(dt);
      // ⑤ 공-선수 몸통 충돌 (소유자 없는 공만 대상)
      this._resolveBallPlayerCollisions();
    }

    // ⑥ 소유권 판정
    this._updateOwnership(dt);

    // ⑦ 경계 + 골포스트 충돌
    this._checkBoundaries();
  }

  // ── AI ──────────────────────────────────────────────────────

  // ================================================================
  //  FSM — 유한 상태 기계 (Finite State Machine)
  //
  //  상태 목록:
  //    IDLE      — 경기 중단 중 정지 대기
  //    RUNNING   — 포메이션 기본 위치로 이동 (오프더볼)
  //    CHASING   — 루즈볼(소유자 없는 공)을 향해 전속력 압박
  //    DRIBBLING — 공 소유, 킥 준비 카운트다운 중 드리블 전진
  //    PASSING   — 킥 타이머 만료 → 동료에게 패스 실행 (1틱)
  //    SHOOTING  — 킥 타이머 만료 → 골대를 향해 슈팅 실행 (1틱)
  //    MARKING   — 수비, 근접 적 공격수를 따라다니며 견제
  //    TACKLING  — 볼 소유 적에게 접근, 근접하면 확률 태클
  //    GK_GUARD  — 골키퍼 전용 포지셔닝 + 다이빙
  //
  //  전환 규칙은 _evaluatePlayerState() 에 집중되어 있다.
  // ================================================================

  /**
   * _updateAI: 매 틱 모든 선수의 FSM을 구동한다.
   *
   * 흐름:
   *   0. Formation Manager: 두 팀의 tacticalPosition을 먼저 일괄 갱신한다.
   *   1. 팀별 공유 컨텍스트(chaser 등)를 계산한다.
   *   2. 각 선수의 상태 전환 평가(_evaluatePlayerState)를 먼저 수행한다.
   *   3. 확정된 state 값에 따라 상태 메서드를 switch로 디스패치한다.
   */
  _updateAI(dt) {
    // ── Phase 0: Formation Manager — 전술 위치 일괄 갱신 ────────────────
    // 양 팀의 tacticalPosition을 FSM보다 먼저 계산해야
    // _stateRunning이 올바른 앵커를 참조할 수 있다.
    const possTeam = this.ball.owner?.team ?? null;
    this.homeTeam.updateTacticalPositions(this.ball, possTeam, dt);
    this.awayTeam.updateTacticalPositions(this.ball, possTeam, dt);

    // ── Team Decision Layer: 팀 전체 상황(페이즈·볼 구역·위험도) 판단 ──
    this.homeTeam.updateAIContext(this.ball, possTeam);
    this.awayTeam.updateAIContext(this.ball, possTeam);

    // ── Role Assignment Layer: 팀 내 선수별 역할(WHO) 배정 + 목표(WHERE) 갱신 ──
    this._assignRoles(this.homeTeam, this.awayTeam);
    this._assignRoles(this.awayTeam, this.homeTeam);

    for (const team of [this.homeTeam, this.awayTeam]) {
      const oppTeam  = team === this.homeTeam ? this.awayTeam : this.homeTeam;
      const oppGoalX = team.attackingDir === 1 ? PITCH_LEN : 0;
      const oppGoalC = new Vector2D(oppGoalX, CY);

      // ── ���락 중인 키커는 chaser/pressers 선정에서 제외 (버그 수정 1) ──
      // kickLockTimer > 0 동안 키커가 자신의 공을 쫓아가는 현상 방지
      const kicker = this.ball.kickLockTimer > 0 ? this.ball.kicker : null;

// 루즈볼 추적자: 공 소유자 없을 때 팀 내 최근접 선수 1명만 선정
      // 패스 진행 중일 때는 같은 팀 동료(수신자 후보)를 우선 추적하도록 개선
      let chaser = null;
      if (!this.ball.owner) {
        const candidates = team.players
          .filter(p => p !== kicker) // ����� ���� 중인 키커 제외
          .filter(p => p.role !== 'GK') // GK는 루즈볼 추적 제외
          .map(p => ({ player: p, dist: p.position.sub(this.ball.position).length() }))
          .sort((a, b) => a.dist - b.dist);
        // 패스 팀이 있고 같은 팀이면(패스 수신 상황) 가장 가까운 동료 우선
        if (this.ball.passTeam === team && candidates.length > 0) {
          chaser = candidates[0].player;
        } else if (candidates.length > 0) {
          chaser = candidates[0].player;
        }
      }

      // 역할 계층이 압박 담당을 단독으로 결정한다. 기존 다중 거리 기반 압박은 사용하지 않는다.
      // 컨텍스트 객체: 상태 전환·상태 메서드에 공유되는 읽기 전용 정보
      const ctx = { oppTeam, oppGoalC, chaser, dt };

      for (const player of team.players) {
        // ── Phase 1: 상태 전환 평가 ──
        this._evaluatePlayerState(player, ctx);

        // ── Phase 2: 현재 state에 따라 행동 실행 ──
        switch (player.state) {
          case 'IDLE':      this._stateIdle(player);                      break;
          case 'DRIBBLING': this._stateDribbling(player, ctx, dt);        break;
          case 'PASSING':   this._statePassing(player, ctx);              break;
          case 'SHOOTING':  this._stateShooting(player, ctx);             break;
          case 'CHASING':   this._stateChasing(player);                   break;
          case 'JOCKEY':    this._stateJockey(player, ctx);               break;
          case 'TACKLING':  this._stateTackling(player, ctx);             break;
          case 'MARKING':   this._stateMarking(player, ctx);              break;
          case 'GK_GUARD':  this._stateGkGuard(player);                   break;
          case 'RUNNING':
          default:          this._stateRunning(player, ctx);              break;
        }
      }
    }
  }

  // ================================================================
  //  ROLE ASSIGNMENT LAYER
  //  "팀 내에서 누가 무엇을 담당하는가"를 결정한다. FSM State("어떻게 실행하는가")
  //  와는 독립적인 계층이며, _evaluatePlayerState/_stateRunning이 이 결과
  //  (player.roleAssignment, player.roleTarget)를 참고해 행동을 결정한다.
  //
  //  구조:
  //    _assignRoles           — 팀별 진입점. WHO(역할 배정, 주기적)와
  //                              WHERE(roleTarget 갱신, 매틱)를 분리해 호출한다.
  //    _assignDefenseRoles    — 수비 역할 WHO: PRIMARY_PRESSER/SECONDARY_COVER/
  //                              PASS_BLOCKER/MARKER/HOLD_LINE
  //    _assignAttackRoles     — 공격 역할 WHO: BALL_HOLDER/REST_DEFENDER/
  //                              WIDTH_HOLDER/FORWARD_RUNNER/PASS_SUPPORT/BACK_SUPPORT
  //    _refreshRoleTargets    — 배정된 역할별 이동 목표(WHERE)를 매틱 최신 위치로 갱신
  // ================================================================

  /**
   * 팀 하나에 대해 Role Assignment Layer를 구동한다.
   * WHO(역할 배정)는 ROLE_DECISION_INTERVAL마다만 재계산해 매 프레임 깜빡임을 방지하고,
   * WHERE(roleTarget)는 배정된 역할을 기준으로 매틱 최신 볼/상대 위치를 반영해 갱신한다.
   */
  _assignRoles(team, oppTeam) {
    const ctx = team.aiContext;
    const weHaveBall = this.ball.owner?.team === team;
    const dueForUpdate = this.matchTime - ctx.lastRoleUpdate >= ROLE_DECISION_INTERVAL;

    if (dueForUpdate) {
      ctx.lastRoleUpdate = this.matchTime;
      if (weHaveBall) this._assignAttackRoles(team, oppTeam, ctx);
      else this._assignDefenseRoles(team, oppTeam, ctx);
    }

    this._refreshRoleTargets(team, oppTeam, ctx, weHaveBall);
  }

  /** 역할(WHO) 확정 헬퍼. 변경 시각을 기록해 디버그 오버레이·향후 확장에 사용한다. */
  _commitRole(player, role, force = false) {
    if (!force && player.roleAssignment === role) return;
    if (!force && player.roleAssignment && this.matchTime < player.roleMinHoldUntil) return;
    player.roleAssignment = role;
    player.roleAssignedAt = this.matchTime;
    player.roleMinHoldUntil = this.matchTime + ROLE_MIN_HOLD_TIME;
  }

  /**
   * 수비 역할(WHO) 배정.
   * 단순 "가까우니까 압박/마킹"이 아니라:
   *   PRIMARY_PRESSER — 도달시간 + 라인이탈 패널티 기반 스코어링으로 1명만 선정
   *   SECONDARY_COVER — 프레서가 뚫렸을 때 위험 공간(골문-볼 라인)을 커버할 1명
   *   PASS_BLOCKER    — 가장 위험한 오프더볼 상대로의 패스 경로를 막을 1명
   *   MARKER          — 위험도 내림차순으로 상대에게 그리디 배정 (중복 마킹 방지)
   *   HOLD_LINE       — 나머지는 포메이션 라인 유지
   */
  _assignDefenseRoles(team, oppTeam, ctx) {
    const outfield = team.players.filter(p => p.role !== 'GK');
    for (const p of outfield) { p._markAssignee = null; this._commitRole(p, 'HOLD_LINE'); }

    const ballOwner = this.ball.owner;
    if (!ballOwner || ballOwner.team !== oppTeam) {
      // 루즈볼이거나 우리 팀 소유로 넘어가는 과도기: 압박팀 역할 없이 마킹만 배정
      ctx.primaryPresser = null; ctx.secondaryCover = null; ctx.passBlockers = [];
      this._assignMarkers(team, oppTeam, ctx, outfield);
      return;
    }

    // ── PRIMARY_PRESSER: 도달시간이 짧고, 자기 라인에서 크게 이탈하지 않아도 되는 선수 ──
    // [수비 버그 수정] 거리 제한(PR_CHASE_RADIUS * 1.3) 제거 — 팀에서 가장 적합한 1명은
    // 거리에 관계없이 반드시 압박자로 선정해 빌드업 시 공백 방지
    let presser = null, pressBest = -Infinity;
    for (const p of outfield) {
      const dist = p.position.sub(ballOwner.position).length();
      const estTime   = dist / Math.max(p.maxSpeed, 0.1);
      const anchor    = p.tacticalPosition ?? p.basePosition;
      const lineBreak = Math.max(0, anchor.sub(ballOwner.position).length() - dist);
      const score = 100 - estTime * 12 - lineBreak * RD_LINE_BREAK_PENALTY;
      if (score > pressBest) { pressBest = score; presser = p; }
    }
    ctx.primaryPresser = presser;
    if (presser) this._commitRole(presser, 'PRIMARY_PRESSER');

    // ── SECONDARY_COVER: 프레서 다음으로 가까우면서 골문 쪽(뒤)에 위치한 선수 ──
    const ownGoalX = team.attackingDir === 1 ? 0 : PITCH_LEN;
    const ownGoalC = new Vector2D(ownGoalX, CY);
    const pressDistToGoal = ownGoalC.sub(presser ? presser.position : ballOwner.position).length();
    let cover = null, coverBest = -Infinity;
    for (const p of outfield) {
      if (p === presser) continue;
      const dist = p.position.sub(ballOwner.position).length();
      if (dist > PR_CHASE_RADIUS * 1.6) continue;
      const behind = ownGoalC.sub(p.position).length() < pressDistToGoal ? 20 : 0;
      const score  = 60 - dist * 1.5 + behind;
      if (score > coverBest) { coverBest = score; cover = p; }
    }
    ctx.secondaryCover = cover;
    if (cover) this._commitRole(cover, 'SECONDARY_COVER');

    // ── PASS_BLOCKER: 가장 위험한 오프더볼 상대와의 패스 경로를 막을 선수 ──
    const dangerousOpp = this._mostDangerousOpponent(oppTeam, ballOwner, team);
    let blocker = null, blockBest = -Infinity;
    if (dangerousOpp) {
      for (const p of outfield) {
        if (p === presser || p === cover) continue;
        const dist = p.position.sub(ballOwner.position).length();
        if (dist > PR_CHASE_RADIUS * 1.6) continue;
        const score = 50 - dist;
        if (score > blockBest) { blockBest = score; blocker = p; }
      }
    }
    ctx.passBlockers = blocker ? [blocker] : [];
    if (blocker) this._commitRole(blocker, 'PASS_BLOCKER');

    // ── 나머지: 위험도 기반 그리디 마킹, 배정 못 받으면 라인 유지 ──
    const remaining = outfield.filter(p => p !== presser && p !== cover && p !== blocker);
    this._assignMarkers(team, oppTeam, ctx, remaining);
  }

  /** 오프더볼 상대 중 우리 골문에 가장 위협적인 1명을 반환한다 (골문 근접도 + 볼과의 거리). */
  _mostDangerousOpponent(oppTeam, ballOwner, defTeam) {
    const ownGoalX = defTeam.attackingDir === 1 ? 0 : PITCH_LEN;
    let best = null, bestScore = -Infinity;
    for (const opp of oppTeam.players) {
      if (opp === ballOwner || opp.role === 'GK') continue;
      const score = this._opponentDanger(opp, defTeam) * 100 - opp.position.sub(ballOwner.position).length() * 0.5;
      if (score > bestScore) { bestScore = score; best = opp; }
    }
    return best;
  }

  /** 상대 선수 1명의 위협도(0~1 근사): 우리 골문 근접도 + 공격 역할 가중치. */
  _opponentDanger(opp, defTeam) {
    const ownGoalX = defTeam.attackingDir === 1 ? 0 : PITCH_LEN;
    const distToOwnGoal  = Math.abs(opp.position.x - ownGoalX);
    const goalProximity  = Math.max(0, 1 - distToOwnGoal / (PITCH_LEN * 0.5));
    const forwardWeight  = ['ST', 'LM', 'RM'].includes(opp.role) ? 1.15 : 1.0;
    return goalProximity * forwardWeight;
  }

  /**
   * 그리디 마킹 배정: 위험도 내림차순 상대에게, 아직 마킹을 배정받지 못한
   * 가장 가까운 수비 역할(CB/LB/RB/CM) 선수를 매칭한다. 같은 상대를 여러 명이
   * 동시에 마킹하지 않도록 usedOpp/이미 배정된 선수를 제외한다.
   */
  _assignMarkers(team, oppTeam, ctx, candidates) {
    ctx.markers = [];
    const markable = oppTeam.players.filter(p => p.role !== 'GK' && p !== this.ball.owner);
    const ranked = markable
      .map(o => ({ opp: o, danger: this._opponentDanger(o, team) }))
      .sort((a, b) => b.danger - a.danger);

    const defenders = candidates.filter(p => ['CB', 'LB', 'RB', 'CM'].includes(p.role));
    const usedOpp = new Set();

    for (const { opp } of ranked) {
      if (usedOpp.has(opp.id)) continue;
      let best = null, bestD = MARKING_RADIUS * 1.8;
      for (const def of defenders) {
        if (def._markAssignee) continue;
        const d = def.position.sub(opp.position).length();
        if (d < bestD) { bestD = d; best = def; }
      }
      if (best) {
        best._markAssignee = opp;
        this._commitRole(best, 'MARKER');
        ctx.markers.push({ defender: best, opponent: opp });
        usedOpp.add(opp.id);
      }
    }

    for (const p of candidates) {
      if (!p._markAssignee && p.roleAssignment === 'HOLD_LINE') this._commitRole(p, 'HOLD_LINE');
    }
  }

  /**
   * 공격 역할(WHO) 배정.
   *   BALL_HOLDER    — 볼 소유 선수 자신
   *   REST_DEFENDER  — 중앙 수비수는 항상 후방 균형 유지, 볼이 깊이 전진하면 CM 1명 추가
   *   WIDTH_HOLDER   — 볼 반대쪽 풀백/와이드 미드필더 — 폭 유지로 팀 구조 붕괴 방지
   *   FORWARD_RUNNER — 공격 역할(ST/LM/RM) 중 볼과 거리가 있어 침투 여력이 있는 선수
   *   BACK_SUPPORT / PASS_SUPPORT — 나머지: 볼보다 후방이면 BACK_SUPPORT, 아니면 PASS_SUPPORT
   */
  _assignAttackRoles(team, oppTeam, ctx) {
    const ballOwner = this.ball.owner;
    if (!ballOwner) return; // 소유권 이전 찰나 — 다음 재평가 주기로 넘김
    const outfield = team.players.filter(p => p.role !== 'GK');
    const dir      = team.attackingDir;

    this._commitRole(ballOwner, 'BALL_HOLDER');
    const assigned = new Set([ballOwner.id]);

    // REST_DEFENDER: 중앙 수비수 항상 잔류
    for (const p of outfield) {
      if (p.role === 'CB') { this._commitRole(p, 'REST_DEFENDER'); assigned.add(p.id); }
    }
    // 볼이 상대 진영 깊숙이 전진했으면 CM 1명(가장 후방)도 추가로 잔류
    if (ctx.ballZone === 'OPPONENT_MIDDLE_THIRD' || ctx.ballZone === 'OPPONENT_DEFENSIVE_THIRD') {
      const ownGoalX = dir === 1 ? 0 : PITCH_LEN;
      const cms = outfield.filter(p => p.role === 'CM' && !assigned.has(p.id));
      if (cms.length) {
        const deepest = cms.reduce((a, b) =>
          Math.abs(a.position.x - ownGoalX) < Math.abs(b.position.x - ownGoalX) ? a : b);
        this._commitRole(deepest, 'REST_DEFENDER');
        assigned.add(deepest.id);
      }
    }

    // WIDTH_HOLDER: 볼 반대쪽 풀백/와이드 미드필더
    for (const p of outfield) {
      if (assigned.has(p.id) || !['LB', 'RB', 'LM', 'RM'].includes(p.role)) continue;
      const isLeftPlayer = ['LB', 'LM'].includes(p.role);
      const onFarSide = ctx.ballSide === 'RIGHT' ? isLeftPlayer
        : ctx.ballSide === 'LEFT' ? !isLeftPlayer : false;
      if (onFarSide) { this._commitRole(p, 'WIDTH_HOLDER'); assigned.add(p.id); }
    }

    // FORWARD_RUNNER: 공격 역할 중 볼과 거리가 있어 침투 여력이 있는 선수
    for (const p of outfield) {
      if (assigned.has(p.id) || !['ST', 'LM', 'RM'].includes(p.role)) continue;
      if (p.position.sub(ballOwner.position).length() > SUPPORT_MIN_DIST) {
        this._commitRole(p, 'FORWARD_RUNNER'); assigned.add(p.id);
      }
    }

    // 나머지: 볼보다 뒤 → BACK_SUPPORT, 볼과 나란하거나 앞 → PASS_SUPPORT
    for (const p of outfield) {
      if (assigned.has(p.id)) continue;
      const isBehind = dir === 1
        ? p.position.x < ballOwner.position.x - 2
        : p.position.x > ballOwner.position.x + 2;
      this._commitRole(p, isBehind ? 'BACK_SUPPORT' : 'PASS_SUPPORT');
      assigned.add(p.id);
    }
  }

  /**
   * 배정된 역할(WHO)에 따라 각 선수의 이동 목표(roleTarget, WHERE)를 매틱 갱신한다.
   * _stateRunning은 tacticalPosition 대신 이 값을 anchor로 우선 사용한다.
   */
  _refreshRoleTargets(team, oppTeam, ctx, weHaveBall) {
    const ballOwner = this.ball.owner;
    const dir       = team.attackingDir;
    const ownGoalX  = dir === 1 ? 0 : PITCH_LEN;
    const ownGoalC  = new Vector2D(ownGoalX, CY);

    for (const p of team.players) {
      if (p.role === 'GK') continue;

      switch (p.roleAssignment) {
        case 'PRIMARY_PRESSER':
          // 실제 이동은 CHASING/TACKLING FSM이 담당 — roleTarget은 디버그·참고용
          p.roleTarget = ballOwner ? ballOwner.position.clone() : null;
          break;

        case 'SECONDARY_COVER': {
          if (!ballOwner) { p.roleTarget = null; break; }
          const toGoal   = ownGoalC.sub(ballOwner.position);
          const dist     = toGoal.length();
          const backDist = Math.min(dist * 0.5, RD_COVER_OFFSET + dist * 0.15);
          p.roleTarget = dist > 0.1
            ? ballOwner.position.add(toGoal.normalize().scale(backDist))
            : ownGoalC.clone();
          break;
        }

        case 'PASS_BLOCKER': {
          if (!ballOwner) { p.roleTarget = null; break; }
          const dangerOpp = this._mostDangerousOpponent(oppTeam, ballOwner, team);
          p.roleTarget = dangerOpp
            ? ballOwner.position.add(dangerOpp.position.sub(ballOwner.position).scale(RD_BLOCK_LEAD))
            : null;
          break;
        }

        case 'MARKER': {
          const opp = p._markAssignee;
          if (opp) {
            const toGoalFromOpp = ownGoalC.sub(opp.position).normalize();
            p.roleTarget = opp.position.add(toGoalFromOpp.scale(1.2));
          } else {
            p.roleTarget = null;
          }
          break;
        }

        case 'WIDTH_HOLDER': {
          const anchorY = p.tacticalPosition?.y ?? p.basePosition.y;
          const isTop   = p.basePosition.y < CY;
          const y = isTop
            ? Math.max(WIDTH_Y_MARGIN, Math.min(anchorY, PITCH_WID * 0.30))
            : Math.min(PITCH_WID - WIDTH_Y_MARGIN, Math.max(anchorY, PITCH_WID * 0.70));
          p.roleTarget = new Vector2D(p.tacticalPosition?.x ?? p.basePosition.x, y);
          break;
        }

        case 'FORWARD_RUNNER':
          p.roleTarget = this._computeForwardRunTarget(p, team, oppTeam);
          break;

        case 'PASS_SUPPORT':
        case 'BACK_SUPPORT':
          p.roleTarget = this._computeSupportTarget(p, team, oppTeam, p.roleAssignment === 'BACK_SUPPORT');
          break;

        case 'HOLD_LINE':
        case 'REST_DEFENDER':
        case 'BALL_HOLDER':
        default:
          // 포메이션 기준점(tacticalPosition) 그대로 사용 — _stateRunning이 폴백 처리
          p.roleTarget = null;
          break;
      }
    }
  }

  /**
   * PASS_SUPPORT/BACK_SUPPORT 목표 위치 산출.
   * 볼 소유자 기준 여러 후보 방향(전방/대각/후방)을 스코어링해 가장 좋은 지점을 고른다.
   *   supportScore = 패스경로개방 + 오픈스페이스 + 공격진출도 - 동료간격패널티
   */
  _computeSupportTarget(player, team, oppTeam, preferBack) {
    const ballOwner = this.ball.owner;
    if (!ballOwner) return null;
    const dir = team.attackingDir;
    const baseAngle = dir === 1 ? 0 : Math.PI;

    // 후보 오프셋(볼 진행 방향 기준 상대 각도) — 후방 지원 vs 전방 지원 후보군을 다르게 구성
    const angleOffsets = preferBack
      ? [-0.35 * Math.PI, 0.35 * Math.PI, Math.PI, -0.15 * Math.PI, 0.15 * Math.PI]
      : [0.15 * Math.PI, -0.15 * Math.PI, 0.35 * Math.PI, -0.35 * Math.PI, 0];
    const radius = SUPPORT_MIN_DIST + (SUPPORT_MAX_DIST - SUPPORT_MIN_DIST) * 0.4;

    let best = null, bestScore = -Infinity;
    for (const off of angleOffsets) {
      const cand = ballOwner.position.add(Vector2D.fromAngle(baseAngle + off, radius));
      if (cand.x < 3 || cand.x > PITCH_LEN - 3 || cand.y < 3 || cand.y > PITCH_WID - 3) continue;

      const laneClear = this._isPathClear(ballOwner.position, cand, oppTeam) ? 25 : 0;

      let minOpp = Infinity;
      for (const opp of oppTeam.players) {
        if (opp.role === 'GK') continue;
        minOpp = Math.min(minOpp, opp.position.sub(cand).length());
      }
      const openSpace = Math.min(minOpp, OPEN_SPACE_R * 2) * 5;

      const progress = (dir === 1 ? cand.x : PITCH_LEN - cand.x) * 0.3;

      let spacingPenalty = 0;
      for (const mate of team.players) {
        if (mate === player || mate === ballOwner) continue;
        const d = mate.position.sub(cand).length();
        if (d < TEAMMATE_MIN_SPACING) spacingPenalty += (TEAMMATE_MIN_SPACING - d) * 4;
      }

      const score = laneClear + openSpace + progress - spacingPenalty;
      if (score > bestScore) { bestScore = score; best = cand; }
    }
    return best;
  }

  /**
   * FORWARD_RUNNER 침투 목표 위치. 상대 최종 수비 라인 바로 뒤(1.5m 여유)까지만 침투해
   * 명백한 오프사이드 유발 침투를 방지한다. 실제 오프사이드 판정은 기존
   * offsideLineX 스냅샷 시스템(_executeKick/_updateOwnership)이 수신 시점에 담당한다.
   */
  _computeForwardRunTarget(player, team, oppTeam) {
    const dir = team.attackingDir;
    const defXs = oppTeam.players.filter(p => p.role !== 'GK').map(p => p.position.x);
    if (defXs.length === 0) return null;
    const lastDefX = dir === 1 ? Math.min(...defXs) : Math.max(...defXs);
    const safeX    = dir === 1 ? lastDefX - 1.5 : lastDefX + 1.5;
    const clampedX = Math.max(3, Math.min(PITCH_LEN - 3, safeX));
    return new Vector2D(clampedX, player.basePosition.y);
  }

  /**
   * _evaluatePlayerState: 매 틱 선수의 상태를 재평가하고 전환한다.
   *
   * 우선순위 (위에서 아래로, 먼저 매칭된 규칙이 적용):
   *   1. 경기 중단(IDLE phase) → IDLE
   *   2. hasBall=true
   *      a. kickTimer < KICK_DELAY  → DRIBBLING
   *      b. 골대 SHOOT_DIST 이내    → SHOOTING
   *      c. 앞쪽 동료 있음          → PASSING
   *      d. 폴백                    → SHOOTING
   *   3. GK → GK_GUARD
   *   4. 루즈볼 추적자(chaser) → CHASING
   *   5. 볼 소유 적이 TACKLE_RADIUS 이내 → TACKLING
   *   6. 오프더볼 적 공격수가 MARKING_RADIUS 이내(수비 역할만) → MARKING
   *   7. 기본 → RUNNING
   */
  _evaluatePlayerState(player, ctx) {
    const { oppTeam, oppGoalC, chaser, dt } = ctx;
    if (this.phase !== 'IN_PLAY') { player.state = 'IDLE'; return; }

    if (player.hasBall) {
      if (player.role === 'GK') {
        player.kickTimer += dt;
        if (player.kickTimer < GK_HOLD_DELAY) { player.state = 'GK_GUARD'; return; }
        const plan = this._findPassPlan(player, oppTeam);
        // [버그 수정] GK 숏패스 볼 점유권 상실 방지: 수신자 근처 6m 이내 수비수가 있으면
        // 패스 대신 클리어런스 강제 — 위험 지역 숏패스로 인한 턴오버 방지
        let planSafe = false;
        if (plan) {
          const nearOppCount = oppTeam.players.filter(o =>
            o.role !== 'GK' && o.position.sub(plan.targetPosition).length() < 6
          ).length;
          planSafe = nearOppCount === 0;
        }
        if (planSafe) { player._passPlan = plan; player.state = 'PASSING'; }
        else { player._clearanceTarget = oppGoalC; player.state = 'PASSING'; }
        return;
      }
      player.kickTimer += dt;
      this._decideBallAction(player, oppTeam, oppGoalC);
      if (player.actionDecision === 'PASS' && player._passPlan) { player.state = 'PASSING'; return; }
      if (player.actionDecision === 'SHOOT') { player.state = 'SHOOTING'; return; }
      player.state = 'DRIBBLING';
      return;
    }

    if (player.role === 'GK') {
      if (!this.ball.owner && !this.ball.isShot && player.position.sub(this.ball.position).length() < GK_SWEEPER_DIST) {
        player.state = 'CHASING'; return;
      }
      player.state = 'GK_GUARD'; return;
    }

    if (!this.ball.owner && player === chaser) { player.state = 'CHASING'; player._pressRank = -1; return; }

    // [수비 버그 수정] 전역 근접 태클 예외: 역할과 무관하게 볼 소유 적이 TACKLE_RADIUS 이내면
    // 무조건 TACKLING — HOLD_LINE·MARKER 등이 공 바로 옆에서 구경하는 현상 방지
    // [버그 수정] GK 면역 예외: GK가 자기 페널티 박스 밖으로 나온 경우 태클 허용
    if (this.ball.owner && this.ball.owner.team === oppTeam) {
      const bOwner = this.ball.owner;
      const isOppGKInBox = bOwner.role === 'GK' && this._isInOwnPenaltyBox(bOwner);
      if (!isOppGKInBox && player.position.sub(bOwner.position).length() <= TACKLE_RADIUS) {
        player.state = 'TACKLING';
        return;
    }
    }

    // [버그 수정] 8m 절대 추격 오버라이드: RECOVER 또는 HOLD_LINE 역할이라도
    // 볼 소유 적이 8m 이내면 CHASING — 이 범위에서 RUNNING 유지 시 동상(Statue) 현상 발생
    // PRIMARY_PRESSER만 허용하도록 제한
    if (this.ball.owner && this.ball.owner.team === oppTeam) {
      const distToBallOwner = player.position.sub(this.ball.owner.position).length();
      const isPrimaryPresser = player.roleAssignment === 'PRIMARY_PRESSER';
      if (distToBallOwner <= 8 &&
          (player.transitionRole === 'RECOVER' || player.roleAssignment === 'HOLD_LINE') &&
          isPrimaryPresser) {
        player.state = 'CHASING';
        return;
      }
    }

    switch (player.roleAssignment) {
      case 'PRIMARY_PRESSER': {
        const owner = this.ball.owner;
        if (owner && owner.team === oppTeam) {
          // [수비 버그 수정] TACKLE_RADIUS 이내는 위 전역 규칙이 이미 TACKLING 처리함.
          // 원거리(>TACKLE_RADIUS)에서는 JOCKEY 대신 CHASING으로 적극 압박 — 뒷걸음질 방지
          player.state = 'CHASING';
          player._pressRank = 0;
          return;
        }
        break;
      }
      case 'SECONDARY_COVER':
      case 'PASS_BLOCKER':
        // 세컨더리 커버/패스 블로커는 볼 소유자에게 접근하지만 CHASING 상태 대신 RUNNING으로 위치 유지
        if (this.ball.owner && this.ball.owner.team === oppTeam) {
          player.state = 'RUNNING';
          return;
        }
        break;
      case 'MARKER':
        if (player._markAssignee) { player._markTarget = player._markAssignee; player.state = 'MARKING'; return; }
        break;
      case 'HOLD_LINE':
      case 'REST_DEFENDER':
      case 'PASS_SUPPORT':
      case 'WIDTH_HOLDER':
      case 'FORWARD_RUNNER':
      case 'BACK_SUPPORT':
        player.state = 'RUNNING'; return;
    }
    player.state = 'RUNNING';
  }

  /** 공 소유자의 PASS/SHOOT/DRIBBLE 선택을 우선순위 기반으로 결정한다.
   * [버그 수정] 기존 유틸리티 수식이 복잡하여 DRIBBLE이 거의 항상 선택되던 문제를 수정:
   *   SHOOT(슈팅 가능) → PASS(패스 플랜 존재) → DRIBBLE(기본) 순서로 단순화.
   */
  _decideBallAction(player, oppTeam, oppGoalC) {
    const now = this.matchTime;

    // 커밋 시간 내에는 재평가 생략 (드리블 중 수비가 바짝 붙으면 즉시 재평가)
    if (player.actionDecision && now < player.actionCommitUntil) {
      const nearestOppNow = oppTeam.players.filter(p => p.role !== 'GK')
        .reduce((d,p) => Math.min(d, p.position.sub(player.position).length()), Infinity);
      if (player.actionDecision === 'DRIBBLE' && nearestOppNow < 1.1) player.actionCommitUntil = now;
      else return;
    }
    if (now - player.lastActionEvalAt < ACTION_DECISION_INTERVAL && player.actionDecision) return;
    player.lastActionEvalAt = now;

    const distToGoal = oppGoalC.sub(player.position).length();
    const shotClear  = this._isPathClear(player.position, oppGoalC, oppTeam);

    // [버그 수정] 우선순위 1: 슈팅 가능 거리 + 시야 확보 시 즉시 SHOOT
    if (distToGoal <= SHOOT_DIST && shotClear) {
      player.actionDecision     = 'SHOOT';
      player.actionStartedAt    = now;
      player.actionCommitUntil  = now;
      return;
    }

    // [버그 수정] 우선순위 2: 유효한 패스 플랜이 있으면 PASS
    const passPlan = this._findPassPlan(player, oppTeam);
    if (passPlan) {
      player.actionDecision    = 'PASS';
      player._passPlan         = passPlan;
      player.actionStartedAt   = now;
      player.actionCommitUntil = now;
      return;
    }

    // [버그 수정] 우선순위 3: 압박받고 있으면 패스 시도 강제 (드리블 대신)
    const nearestOppDist = oppTeam.players.filter(p => p.role !== "GK")
      .reduce((d, p) => Math.min(d, p.position.sub(player.position).length()), Infinity);
    if (nearestOppDist < 4.0) {
      // 가까운 수비수가 있으면 백패스/측면패스라도 시도
      const fallbackPass = this._findAnyPassOption(player, oppTeam);
      if (fallbackPass) {
        player.actionDecision    = "PASS";
        player._passPlan         = fallbackPass;
        player.actionStartedAt   = now;
        player.actionCommitUntil = now;
        return;
      }
    }

    // [버그 수정] 우선순위 4: 기본��은 DRIBBLE (단, 압박 시 짧은 커��)
    player.actionDecision    = "DRIBBLE";
    player.actionStartedAt   = now;
    player.actionCommitUntil = now + Math.min(DRIBBLE_MAX_COMMIT, DRIBBLE_MIN_COMMIT + Math.random() * 0.6);
    if (!player.dribbleStartPosition) { player.dribbleStartPosition = player.position.clone(); player.dribbleDistance = 0; }
  }

  /** 패스 플랜이 없을 때 대체 패스 ��션 탐색 (백패스/측면패스 포함) */
  _findAnyPassOption(player, oppTeam) {
    const mates = player.team.players.filter(p => p !== player && p.role !== "GK");
    if (mates.length === 0) return null;

    const dir = player.team.attackingDir;
    let best = null, bestScore = -Infinity;

    for (const mate of mates) {
      const dist = mate.position.sub(player.position).length();
      if (dist < 3 || dist > ATTR_VISION_MAX) continue;
      if (!this._isPathClear(player.position, mate.position, oppTeam)) continue;

      // 골 방향 가중치 낮�� (백패스 허용)
      const forward = (mate.position.x - player.position.x) * dir;
      let minOpp = Infinity;
      for (const o of oppTeam.players) {
        if (o.role === "GK") continue;
        minOpp = Math.min(minOpp, o.position.sub(mate.position).length());
      }
      const score = forward * 0.5 + Math.min(minOpp, 8) * 3 - dist * 0.7;
      if (score > bestScore) { bestScore = score; best = { receiver: mate, targetPosition: mate.position.clone(), utility: score, passDistance: dist }; }
    }
    return best;
  }

  // ── 상태 메서드들 ─────────────────────────────────────────────
  // ── 상태 메서드들 ─────────────────────────────────────────────

  /**
   * IDLE: 경기 중단(킥오프 대기, 골 세리머니 등) 중 제자리 정지.
   * desiredVelocity를 0으로 만들어 선수가 미끄러지듯 멈추게 한다.
   */
  _stateIdle(player) {
    player.desiredVelocity = Vector2D.zero();
  }

  /**
   * RUNNING: 오프더볼 선수 포지셔닝.
   *
   * ▸ 수비 상황 (적 팀 소유 / 루즈볼):
   *     basePosition + lineShift 앵커로 직접 이동 — 포메이션·수비 라인 유지.
   *
   * ▸ 공격 상황 (우리 팀 소유):
   *     5가지 조향 힘의 합 벡터로 desiredVelocity 를 계산한다.
   *     각 힘은 (단위벡터 × 가중치 상수) 형태이며, 가중치는 상단 OTB_* 상수로 제어.
   *
   *   힘1 BasePosition   — 앵커로 당기는 닻 역할 (이탈 억제)
   *   힘2 EvadeOpponents — 주변 수비수로부터 멀어지며 빈 공간 창출
   *   힘3 Separation     — 동료끼리 겹치지 않게 미세하게 밀어냄
   *   힘4 PassingLane    — 패스 경로 차단 시 수직 이동으로 새 각도 창출
   *   힘5 PenetratingRun — 공격수(ST/LM/RM) 전용 골대 방향 침투 힘
   *
   * 전환 OUT:
   *   → DRIBBLING  : hasBall = true
   *   → CHASING    : 루즈볼 최근접 선수로 선정됨
   *   → TACKLING   : 적 볼 소유자가 TACKLE_RADIUS 이내
   *   → MARKING    : 수비 역할, 적 공격수가 MARKING_RADIUS 이내
   */
  _stateRunning(player, ctx) {
    const { oppTeam, oppGoalC } = ctx;

    // ── 공통: 앵커 = Formation Manager가 산출한 tacticalPosition ────────
    // updateTacticalPositions()가 볼 위치·공수 상황을 반영해 매 틱 갱신한다.
    // tacticalPosition에는 Vertical(라인 높이) + Horizontal(볼 방향 시프트)가 모두 포함.
    // Role Assignment Layer가 산출한 roleTarget이 있으면 tacticalPosition보다 우선한다.
    // tacticalPosition은 "역할 수행 중이 아닐 때 돌아올 팀 구조상의 기준점"으로 격하되고,
    // roleTarget이 SECONDARY_COVER/PASS_BLOCKER/PASS_SUPPORT/WIDTH_HOLDER/FORWARD_RUNNER 등
    // "지금 무엇을 담당하는가"에 따른 실제 이동 목표가 된다.
    const anchor     = player.roleTarget ?? player.tacticalPosition ?? player.basePosition;
    const toAnchor   = anchor.sub(player.position);
    const anchorDist = toAnchor.length();

    // ── 수비 상황: 포메이션 유지에 집중 ─────────────────────────────
    // 볼이 적 팀에 있거나 주인 없는 루즈볼이면 앵커로 직접 이동한다.
    // 단, COUNTER 역할(역습 중)이면 적이 소유해도 공격 힘 계산으로 넘어간다.
    const ourTeamHasBall = this.ball.owner?.team === player.team;
    const isCounterSprint = player.transitionRole === 'COUNTER';
    if (!ourTeamHasBall && !isCounterSprint) {
      const sf = anchorDist > TETHER_R ? 1.0 : anchorDist > 12 ? 0.75 : anchorDist > 5 ? 0.55 : 0.35;

      // RECOVER 전환 역할 중: 앵커 복귀에 더해 침투해오는 적 공격수 방향으로 추가 힘 적용
      // → 수비수가 "라인으로 뛰면서 자기 마크맨을 향해 몸을 틀어" 수비하는 동작을 연출
      let recoverForce = Vector2D.zero();
      if (player.transitionRole === 'RECOVER') {
        // 가장 가까운 오프더볼 적 공격수를 마크 대상으로 찾는다
        let closestOpp = null, closestD = Infinity;
        for (const opp of oppTeam.players) {
          if (opp.role === 'GK' || opp.hasBall) continue;
          const d = player.position.sub(opp.position).length();
          if (d < closestD && d < MARKING_RADIUS * 2) { closestD = d; closestOpp = opp; }
        }
        if (closestOpp) {
          const toMark = closestOpp.position.sub(player.position);
          recoverForce = toMark.normalize().scale(TR_RETURN_MARK_W);
        }
      }

      // [수비 버그 수정] 볼 쏠림 조향 힘 (Ball-Oriented Pull): 앵커 이동에 더해 공 방향으로
      // 약한 힘(가중치 0.35)을 합산 — 지역 방어를 유지하면서도 공 주변으로 자연스럽게 밀집
      const toBall = this.ball.position.sub(player.position);
      const ballPullForce = toBall.length() > 1.0
        ? toBall.normalize().scale(0.35)
        : Vector2D.zero();

      const moveDir = anchorDist > 0.3
        ? toAnchor.normalize().scale(sf).add(recoverForce).add(ballPullForce)
        : recoverForce.add(ballPullForce);

      if (moveDir.length() > 0.05) {
        player.desiredVelocity = moveDir.normalize().scale(player.maxSpeed * sf);
        player.facingAngle     = moveDir.angle();
      } else {
        player.desiredVelocity = Vector2D.zero();
      }
      return;
    }

    // ═══════════════════════════════════════════════════════════════
    // 공격 상황 — 5가지 조향 힘 합산
    // ═══════════════════════════════════════════════════════════════

// ─ 힘1: 기본 포지션 유지 (Base Position Force) ─────────────────
    // ��커에서 멀수록 강하게 당긴다. 가까우면 약한 힘으로 미세 조정만 수행.
    // 버그 수정 3: ��커 스케일 ��터 상향 조정으로 존(Zone) 유지 강화
    const anchorSF  = anchorDist > TETHER_R ? 1.0
                    : anchorDist > 12       ? 0.90
                    : anchorDist > 5        ? 0.65
                    :                         0.35;
    const baseForce = anchorDist > 0.3
      ? toAnchor.normalize().scale(OTB_BASE_W * anchorSF)
      : Vector2D.zero();

    // ─ 힘2: 수비수 회피 (Evade Opponents Force) ─────────────────────
    // OTB_EVADE_R(5m) 이내 적 선수를 거리에 반비례하는 강도로 밀어낸다.
    // 여러 명이 가까이 있으면 합산되어 더 강한 회피가 일어난다.
    let evadeForce = Vector2D.zero();
    for (const opp of oppTeam.players) {
      if (opp.role === 'GK') continue;
      const away = player.position.sub(opp.position); // 적 → 나 방향
      const d    = away.length();
      if (d < OTB_EVADE_R && d > 0.1) {
        const strength = (OTB_EVADE_R - d) / OTB_EVADE_R; // 가까울수록 1.0에 수렴
        evadeForce = evadeForce.add(away.normalize().scale(strength * OTB_EVADE_W));
      }
    }

    // ─ 힘3: 동료 간격 유지 (Separation Force) ───────────────────────
    // OTB_SEP_R(3m) 이내 동료를 약하게 밀어내 같은 공간에 몰리는 것을 방지한다.
    let sepForce = Vector2D.zero();
    for (const mate of player.team.players) {
      if (mate === player) continue;
